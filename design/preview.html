<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude inwerken</title>
<style>
/* Layout: elke tegel is een tekenblad met titelhoek; overzicht als ladekast per niveau, detail als één kolom tekst met een brede werkbank voor de animatie. */
:root {
  /* Huiskleuren: alleen deze twee regels aanpassen (plus hun donkere tegenhangers verderop). */
  --brand: #0E5A8A;
  --signal: #B9471A;

  --brand-ink: #FFFFFF;
  --brand-soft: #DCE8F0;
  --signal-soft: #F6E2D8;
  --paper: #EEF1F0;
  --sheet: #FAFBFA;
  --ink: #172024;
  --ink-2: #4C595F;
  --rule: #BEC8CA;
  --rule-soft: #DAE0E1;
  --ok: #2A7448;
  --ok-soft: #DCEEE3;
  --bad: #A8322A;
  --bad-soft: #F6DEDB;

  --font-display: "Bahnschrift", "DIN Alternate", "DIN 2014", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, "SF Mono", Menlo, monospace;

  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --step-4: clamp(2.25rem, 1.6rem + 2.6vw, 3.5rem);

  --gutter: clamp(16px, 3vw, 32px);
  --radius: 3px;
  --t-fast: 160ms;
  --t-view: 260ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #6CB2E2; --signal: #FF8E57;
    --brand-ink: #0A1822; --brand-soft: #15303F; --signal-soft: #3A2217;
    --paper: #0F1416; --sheet: #161D20; --ink: #E2E8E9; --ink-2: #9DAAAF;
    --rule: #34414A; --rule-soft: #232D32;
    --ok: #6FC493; --ok-soft: #173325; --bad: #F08B80; --bad-soft: #3B1C19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #6CB2E2; --signal: #FF8E57;
  --brand-ink: #0A1822; --brand-soft: #15303F; --signal-soft: #3A2217;
  --paper: #0F1416; --sheet: #161D20; --ink: #E2E8E9; --ink-2: #9DAAAF;
  --rule: #34414A; --rule-soft: #232D32;
  --ok: #6FC493; --ok-soft: #173325; --bad: #F08B80; --bad-soft: #3B1C19;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 var(--step-0)/1.55 var(--font-body);
}
[hidden] { display: none !important; }
a { color: var(--brand); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
main:focus { outline: none; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.12; text-wrap: balance; margin: 0; letter-spacing: 0.005em; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-mono); font-size: var(--step--1); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; background: var(--ink); color: var(--paper); padding: 8px 12px; z-index: 20; }
.skip:focus { top: 8px; }

/* ---------- Kopbalk ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.topbar-inner {
  max-width: 1200px; margin: 0 auto; padding: 10px var(--gutter);
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
.brand-mark { width: 30px; height: 30px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font: 700 15px/1 var(--font-display); border-radius: 2px; }
.brand-name { font: 600 var(--step-1)/1 var(--font-display); }
.brand-sub { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); letter-spacing: 0.05em; }
.search { position: relative; flex: 1 1 260px; max-width: 380px; }
.search input {
  width: 100%; height: 40px; padding: 0 64px 0 36px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--sheet); color: var(--ink); font: inherit;
}
.search input::placeholder { color: var(--ink-2); }
.search svg { position: absolute; left: 11px; top: 11px; width: 18px; height: 18px; color: var(--ink-2); }
.search kbd { position: absolute; right: 8px; top: 9px; font: 12px/1 var(--font-mono); border: 1px solid var(--rule); border-radius: 2px; padding: 4px 6px; color: var(--ink-2); background: var(--paper); }
.tools { display: flex; gap: 6px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px;
  border: 1px solid var(--rule); border-radius: var(--radius); background: var(--sheet);
  color: var(--ink); font: 500 var(--step--1)/1 var(--font-body); cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--ink-2); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { border-color: var(--ink); }
.btn svg { width: 18px; height: 18px; }
.icon-btn { width: 40px; padding: 0; justify-content: center; }

main { max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter) 64px; }
.view { animation: view-in var(--t-view) ease-out; }
@keyframes view-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Startscherm ---------- */
.hero {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px);
  gap: clamp(24px, 4vw, 56px); align-items: center; padding-block: clamp(28px, 5vw, 56px) 32px;
}
.hero h1 { font-size: var(--step-4); letter-spacing: -0.01em; }
.hero h1 span { color: var(--brand); }
.hero-lead { margin-top: 14px; font-size: var(--step-1); max-width: 34em; color: var(--ink); }
.hero-meta { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 20px; }
.hero-cta { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.demo-note { font-size: var(--step--1); color: var(--ink-2); }
.demo-note button { background: none; border: 0; padding: 0; color: var(--brand); font: inherit; text-decoration: underline; cursor: pointer; }

/* Toegangspas */
.pass {
  position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px;
  padding: 26px 20px 18px; box-shadow: 0 1px 0 var(--rule-soft), 0 14px 30px -18px rgba(0,0,0,0.35);
}
.pass::before { /* sleuf voor het koord */
  content: ""; position: absolute; top: 9px; left: 50%; width: 46px; height: 8px; margin-left: -23px;
  border-radius: 4px; background: var(--paper); border: 1px solid var(--rule);
}
.pass-band { height: 8px; background: var(--brand); margin: 0 -20px 16px; }
.pass-head { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.pass-photo { width: 64px; height: 76px; border: 1px solid var(--rule); background: var(--paper); display: grid; place-items: end center; overflow: hidden; }
.pass-photo svg { width: 56px; height: 64px; color: var(--ink-2); }
.pass-name { font: 600 var(--step-2)/1.1 var(--font-display); }
.pass-role { font-size: var(--step--1); color: var(--ink-2); margin-top: 2px; }
.pass-rows { margin-top: 16px; display: grid; gap: 10px; }
.pass-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.pass-row .label { font-size: 11px; }
.pass-count { font: 12px/1 var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 2px; height: 8px; }
.seg i { flex: 1; background: var(--rule-soft); border-radius: 1px; }
.seg i.on { background: var(--brand); }
.stamp {
  position: absolute; right: 14px; bottom: 54px; transform: rotate(-9deg);
  border: 2px solid var(--signal); color: var(--signal); padding: 4px 8px 3px;
  font: 700 13px/1.1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; text-align: center;
  border-radius: 3px; background: color-mix(in srgb, var(--sheet) 70%, transparent);
}
.stamp small { display: block; font: 10px/1.2 var(--font-mono); letter-spacing: 0.06em; }
.stamp.fresh { animation: stamp-in 420ms cubic-bezier(.2,.9,.3,1.3); }
@keyframes stamp-in { from { transform: rotate(-9deg) scale(1.8); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: 1; } }
.pass-foot { margin-top: 16px; padding-top: 10px; border-top: 1px dashed var(--rule); display: flex; justify-content: space-between; gap: 8px; font: 11px/1.3 var(--font-mono); color: var(--ink-2); }

/* Niveaus en tegels */
.level { margin-top: 40px; }
.level-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(160px, 280px); gap: 8px 24px; align-items: end; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
.level-head h2 { font-size: var(--step-3); }
.level-head p { color: var(--ink-2); margin-top: 4px; max-width: 46em; }
.level-progress { display: grid; gap: 6px; justify-items: end; }
.level-progress .seg { width: 100%; }
.sub-head { margin: 28px 0 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sub-head h3 { font-size: var(--step-1); }
.tiles { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.tile.wide { grid-column: 1 / -1; min-height: 0; grid-template-columns: 96px minmax(0, 1fr); grid-template-rows: auto auto; }
.tile.wide .tile-art { height: auto; padding: 18px 0 14px 18px; align-items: flex-start; }
.tile.wide .tile-body { padding: 18px 18px 14px 0; }
.tile.wide .tile-block { grid-column: 1 / -1; }
.tile {
  position: relative; display: grid; grid-template-rows: auto 1fr auto; min-height: 212px;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius);
  color: var(--ink); text-decoration: none;
  transition: border-color var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
}
.tile:hover { border-color: var(--ink); transform: translateY(-2px); box-shadow: 0 10px 22px -16px rgba(0,0,0,0.45); }
.tile-art { height: 74px; display: flex; align-items: center; padding: 14px 16px 0; color: var(--brand); }
.tile-art svg { width: 56px; height: 56px; }
.tile-body { padding: 8px 16px 14px; display: grid; gap: 6px; align-content: start; }
.tile-title { font: 600 var(--step-1)/1.18 var(--font-display); }
.tile-line { font-size: 0.9rem; color: var(--ink-2); line-height: 1.45; }
.tile-block { display: grid; grid-template-columns: auto 1fr auto; border-top: 1px solid var(--rule); font: 12px/1 var(--font-mono); color: var(--ink-2); }
.tile-block span { padding: 9px 12px; }
.tile-block span + span { border-left: 1px solid var(--rule); }
.tile-block .num { color: var(--ink); font-weight: 600; }
.tile-block .state { text-align: right; }
.tile.read .tile-block .state { color: var(--ok); }
.tile.read .tile-art { color: var(--ok); }
.tile mark { background: var(--signal-soft); color: inherit; padding: 0 1px; }
.empty { margin-top: 32px; padding: 24px; border: 1px dashed var(--rule); color: var(--ink-2); }
.search-count { margin-top: 24px; }

/* ---------- Tegeldetail ---------- */
.crumbbar { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding-block: 18px; border-bottom: 1px solid var(--rule); }
.crumbbar .seg { flex: 1 1 160px; max-width: 260px; }
.crumbs { font-size: var(--step--1); color: var(--ink-2); }
.pager { margin-left: auto; display: flex; gap: 6px; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.sheet-head {
  margin-top: 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 32px; align-items: end;
}
.sheet-head h1 { font-size: var(--step-4); }
.sheet-num { font: 600 var(--step-1)/1 var(--font-mono); color: var(--brand); margin-bottom: 10px; display: block; }
.titleblock { border: 1px solid var(--ink); display: grid; grid-template-columns: repeat(2, auto); font: 12px/1.25 var(--font-mono); min-width: 0; }
.titleblock div { padding: 6px 10px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.titleblock div:nth-child(2n) { border-right: 0; }
.titleblock div:nth-last-child(-n+2) { border-bottom: 0; }
.titleblock dt, .titleblock b { display: block; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); font-weight: 400; }
.oneliner {
  margin-top: 22px; font: 500 var(--step-2)/1.35 var(--font-body); max-width: 36em; padding-left: 18px; border-left: 4px solid var(--brand);
}
.section { margin-top: 40px; max-width: 46rem; }
.section.wide { max-width: none; }
.section > h2 { font-size: var(--step-2); display: flex; align-items: baseline; gap: 12px; }
.section > h2 .label { font-size: 12px; }
.section > p, .section > .prose { margin-top: 12px; max-width: 65ch; }
.prose p + p { margin-top: 10px; }

/* Werkbank (interactieve visual) */
.bench { margin-top: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); }
.bench-stage { padding: 16px 16px 4px; overflow-x: auto; }
.bench-stage svg { display: block; width: 100%; height: auto; }
.bench-caption { margin: 0 16px; padding: 12px 0; border-top: 1px dashed var(--rule); min-height: 3.6em; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.bench-caption .label { padding-top: 3px; }
.bench-controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--rule); }
.bench-controls .spacer { flex: 1; }
.static-steps { margin: 0 16px 16px; padding-left: 1.3em; color: var(--ink-2); font-size: 0.95rem; }
.static-steps li + li { margin-top: 4px; }

.desk-doc { transition: transform 480ms cubic-bezier(.2,.8,.2,1), opacity 480ms ease; }
.desk-doc rect.paper { fill: var(--sheet); stroke: var(--ink-2); stroke-width: 1.2; }
.desk-doc rect.under { fill: var(--rule-soft); stroke: var(--rule); stroke-width: 1; }
.desk-doc text { fill: var(--ink); font: 11px var(--font-body); }
.desk-doc text.tok { fill: var(--ink-2); font: 10px var(--font-mono); }
.desk-doc line { stroke: var(--rule); stroke-width: 1; }
.desk-doc.faded { opacity: 0.32; }
.desk-top { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.desk-label { fill: var(--ink-2); font: 10px var(--font-mono); letter-spacing: 0.08em; }
.gauge-bg { fill: var(--rule-soft); }
.gauge-fill { fill: var(--brand); transition: width 480ms cubic-bezier(.2,.8,.2,1), fill 300ms; }
.gauge-fill.hot { fill: var(--signal); }
.gauge-tick { stroke: var(--ink-2); stroke-width: 1; }
.gauge-text { fill: var(--ink-2); font: 10px var(--font-mono); }
.gauge-strong { fill: var(--ink); font: 600 12px var(--font-mono); }
.gauge-limit { stroke: var(--signal); stroke-width: 1.5; stroke-dasharray: 4 3; }
.folder path { fill: var(--brand-soft); stroke: var(--brand); stroke-width: 1.4; }
.folder text { fill: var(--ink); font: 600 11px var(--font-body); }
.folder text.tok { fill: var(--ink-2); font: 10px var(--font-mono); font-weight: 400; }
.folder { transition: opacity 400ms ease, transform 400ms ease; }
.rot-note { fill: var(--signal); font: 600 11px var(--font-body); transition: opacity 300ms; }

/* Metafoor */
.metaphor { margin-top: 14px; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; padding: 18px; background: var(--brand-soft); border-radius: var(--radius); max-width: 46rem; }
.metaphor svg { width: 56px; height: 56px; color: var(--brand); }

/* Praktijkvoorbeelden */
.cases { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.case { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; align-content: start; }
.case-kind { display: inline-block; justify-self: start; font: 600 11px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 7px; border-radius: 2px; background: var(--paper); color: var(--ink-2); border: 1px solid var(--rule); }
.case-kind.echt { background: var(--brand-soft); color: var(--ink); border-color: transparent; }
.case-kind.numafa { background: var(--signal-soft); color: var(--ink); border-color: transparent; }
.case h3 { font-size: var(--step-1); }
.flow { display: grid; gap: 6px; margin: 0; }
.flow div { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; font-size: 0.93rem; }
.flow dt { font: 11px/1.6 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.flow dd { margin: 0; }
.case .src { font-size: var(--step--1); color: var(--ink-2); }

/* Probeer zelf */
.prompt { margin-top: 14px; border: 1px solid var(--ink); border-radius: var(--radius); background: var(--sheet); max-width: 46rem; }
.prompt-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--rule); }
.prompt-text { margin: 0; padding: 14px; font: 0.95rem/1.55 var(--font-mono); white-space: pre-wrap; word-break: break-word; }
.prompt-help { padding: 0 14px 12px; font-size: var(--step--1); color: var(--ink-2); }
.copy-status { font-size: var(--step--1); color: var(--ok); }
.copy-status.warn { color: var(--signal); }

/* Valkuil */
.pitfall { margin-top: 14px; max-width: 46rem; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; padding: 16px 18px; border: 2px solid var(--signal); border-radius: var(--radius); background: var(--signal-soft); }
.pitfall svg { width: 36px; height: 36px; color: var(--signal); }

/* Quiz */
.quiz { margin-top: 14px; display: grid; gap: 18px; max-width: 46rem; }
.q { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--sheet); padding: 16px 18px; margin: 0; }
.q legend { float: left; width: 100%; padding: 0; font: 600 var(--step-1)/1.3 var(--font-display); }
.q legend + * { clear: both; }
.q .opts { margin-top: 10px; display: grid; gap: 8px; }
.q label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--radius); cursor: pointer; }
.q label:hover { border-color: var(--ink-2); }
.q input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--brand); }
.q label.right { border-color: var(--ok); background: var(--ok-soft); }
.q label.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q .fb { margin-top: 10px; font-size: 0.95rem; }
.q .fb strong { font-family: var(--font-display); }
.score { font: 600 var(--step-0)/1 var(--font-mono); }

/* Bron */
.provenance { margin-top: 48px; padding-top: 16px; border-top: 2px solid var(--ink); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 32px; align-items: start; }
.provenance ul { margin: 6px 0 0; padding-left: 1.1em; }
.provenance li { margin-top: 4px; overflow-wrap: anywhere; }
.next-up { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 32px; }
.next-up a { display: grid; gap: 4px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: var(--radius); text-decoration: none; color: var(--ink); background: var(--sheet); }
.next-up a:hover { border-color: var(--ink); }
.next-up a.next { text-align: right; }
.next-up .t { font: 600 var(--step-1)/1.2 var(--font-display); }
.placeholder { margin-top: 32px; padding: 24px; border: 1px dashed var(--rule); max-width: 46rem; color: var(--ink-2); }

footer.site { max-width: 1200px; margin: 0 auto; padding: 20px var(--gutter) 40px; border-top: 1px solid var(--rule); color: var(--ink-2); font-size: var(--step--1); display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .level-head { grid-template-columns: minmax(0, 1fr); }
  .level-progress { justify-items: start; }
  .sheet-head { grid-template-columns: minmax(0, 1fr); }
  .provenance { grid-template-columns: minmax(0, 1fr); }
  .next-up { grid-template-columns: minmax(0, 1fr); }
  .search kbd { display: none; }
  .brand-sub { display: none; }
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .tile { min-height: 0; grid-template-columns: 72px minmax(0, 1fr); grid-template-rows: auto auto; }
  .tile-art { grid-row: 1; height: auto; padding: 16px 0 0 14px; align-items: flex-start; }
  .tile-art svg { width: 44px; height: 44px; }
  .tile-body { padding: 14px 14px 12px 0; }
  .tile-block { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {

  /* ---------- Het bureau dat volloopt ---------- */
  function setupDesk() {
    var svg = document.getElementById("desk");
    var NS = "http://www.w3.org/2000/svg";
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var CAP = 1000000;
    var DOCS = [
      ["Jouw vraag", 2000], ["Antwoord", 6000], ["Mailthread, 14 mails", 40000], ["Handleiding, 300 p.", 260000],
      ["Excel-export", 180000], ["Foto’s storing", 90000], ["Antwoord", 12000], ["Logbestand", 240000], ["Nog een vraag", 3000]
    ];
    // Twee indelingen van hetzelfde bureau: breed (pc) en smal (telefoon), zodat de tekst leesbaar blijft.
    var narrow = document.getElementById("bench").clientWidth < 620;
    var L = narrow ? {
      vw: 360, vh: 480, desk: [10, 10, 340, 392], label: [22, 30], folder: [22, 42],
      cols: 3, cw: 104, ch: 58, x0: 22, y0: 116, gx: 8, gy: 12, rot: [22, 386],
      gauge: { x: 20, y: 426, w: 320, h: 12 }, ticks: [0, 500000, 1000000], limitBelow: true
    } : {
      vw: 680, vh: 300, desk: [20, 14, 640, 174], label: [32, 32], folder: [32, 92],
      cols: 5, cw: 96, ch: 58, x0: 136, y0: 52, gx: 10, gy: 16, rot: [136, 182],
      gauge: { x: 40, y: 236, w: 600, h: 12 }, ticks: [0, 250000, 500000, 750000, 1000000], limitBelow: false
    };
    svg.setAttribute("viewBox", "0 0 " + L.vw + " " + L.vh);
    var G = L.gauge;
    var items = [], summary = null, placed = 0, step = 0, timer = null;

    function el(name, attrs, parent) { var e = document.createElementNS(NS, name); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
    function fmt(n) { return n.toLocaleString("nl-NL"); }
    function kTok(n) { return n >= 1000 ? Math.round(n / 1000) + "k" : String(n); }

    // statisch decor: bureaublad, plek voor de map, meter met schaal
    el("rect", { x: L.desk[0], y: L.desk[1], width: L.desk[2], height: L.desk[3], rx: 4, "class": "desk-top" }, svg);
    var lbl = el("text", { x: L.label[0], y: L.label[1], "class": "desk-label" }, svg); lbl.textContent = "BUREAU · DIT GESPREK";
    var folderG = el("g", { "class": "folder", opacity: 0, transform: "translate(" + L.folder[0] + " " + L.folder[1] + ")" }, svg);
    el("path", { d: "M0 0h30l6 7h56v62H0z" }, folderG);
    var ft = el("text", { x: 8, y: 32 }, folderG); ft.textContent = "Samenvatting";
    var ftok = el("text", { x: 8, y: 50, "class": "tok" }, folderG); ftok.textContent = "60k tokens";
    var docsG = el("g", {}, svg);
    var rot = el("text", { x: L.rot[0], y: L.rot[1], "class": "rot-note", opacity: 0 }, svg); rot.textContent = "Oudste stukken worden vaag: context rot";
    el("rect", { x: G.x, y: G.y, width: G.w, height: G.h, rx: 2, "class": "gauge-bg" }, svg);
    var fill = el("rect", { x: G.x, y: G.y, width: 0, height: G.h, rx: 2, "class": "gauge-fill" }, svg);
    L.ticks.forEach(function (v) {
      var x = G.x + G.w * v / CAP;
      el("line", { x1: x, y1: G.y + G.h + 2, x2: x, y2: G.y + G.h + 7, "class": "gauge-tick" }, svg);
      var tx = el("text", { x: x, y: G.y + G.h + 20, "text-anchor": v === 0 ? "start" : (v === CAP ? "end" : "middle"), "class": "gauge-text" }, svg);
      tx.textContent = v === CAP ? "1M tokens" : kTok(v);
    });
    var lx = G.x + G.w * 0.8;
    el("line", { x1: lx, y1: G.y - 8, x2: lx, y2: G.y + G.h + (L.limitBelow ? 26 : 2), "class": "gauge-limit" }, svg);
    var lt = L.limitBelow
      ? el("text", { x: lx - 6, y: G.y + G.h + 36, "text-anchor": "end", "class": "gauge-text" }, svg)
      : el("text", { x: lx - 6, y: G.y - 4, "text-anchor": "end", "class": "gauge-text" }, svg);
    lt.textContent = "80%: hier gaat hij samenvatten";
    var used = el("text", { x: G.x, y: G.y - (L.limitBelow ? 10 : 16), "class": "gauge-strong" }, svg);

    function slotXY(i) { return { x: L.x0 + (i % L.cols) * (L.cw + L.gx), y: L.y0 + Math.floor(i / L.cols) * (L.ch + L.gy) }; }
    function total() { return items.reduce(function (s, d) { return s + d.t; }, 0) + (summary ? summary : 0); }
    function makeDoc(label, t) {
      var g = el("g", { "class": "desk-doc" }, docsG);
      var layers = t > 150000 ? 3 : (t > 30000 ? 2 : 1);
      for (var k = layers - 1; k > 0; k--) el("rect", { x: k * 4, y: -k * 4, width: L.cw - 8, height: L.ch - 8, "class": "under" }, g);
      el("rect", { x: 0, y: 0, width: L.cw - 8, height: L.ch - 8, "class": "paper" }, g);
      el("line", { x1: 8, y1: 30, x2: L.cw - 22, y2: 30 }, g);

      var a = el("text", { x: 8, y: 17 }, g); a.textContent = label.length > 15 ? label.slice(0, 14) + "…" : label;
      var b = el("text", { x: 8, y: L.ch - 13, "class": "tok" }, g); b.textContent = kTok(t) + " tok";
      return g;
    }
    function layout() {
      items.forEach(function (d, i) { var p = slotXY(i); d.g.style.transform = "translate(" + p.x + "px," + p.y + "px)"; });
    }
    function update(caption) {
      var tot = total(), pct = tot / CAP;
      fill.setAttribute("width", Math.min(1, pct) * G.w);
      fill.setAttribute("class", "gauge-fill" + (pct >= 0.8 ? " hot" : ""));
      used.textContent = fmt(tot) + " / " + fmt(CAP) + " tokens · " + Math.round(pct * 100) + "%";
      if (caption) document.getElementById("caption").textContent = caption;
      document.getElementById("step-label").textContent = "Stap " + step;
      document.getElementById("add").disabled = placed >= DOCS.length || items.length >= 10;
      document.getElementById("compact").disabled = items.length < 3;
      document.getElementById("play").textContent = step > 0 ? "Opnieuw afspelen" : "Afspelen";
    }
    function addDoc() {
      if (placed >= DOCS.length || items.length >= 10) return false;
      var d = DOCS[placed++];
      var g = makeDoc(d[0], d[1]);
      items.push({ label: d[0], t: d[1], g: g });
      var p = slotXY(items.length - 1);
      if (!reduced) {
        g.style.transition = "none"; g.style.opacity = "0";
        g.style.transform = "translate(" + p.x + "px," + (p.y - 46) + "px)";
        g.getBoundingClientRect();
        g.style.transition = ""; g.style.opacity = "";
      }
      g.style.transform = "translate(" + p.x + "px," + p.y + "px)";
      step++;
      var pct = total() / CAP;
      update(d[0] + " erbij: +" + fmt(d[1]) + " tokens. " + (pct >= 0.8 ? "Het bureau is bijna vol." : "Er is nog ruimte."));
      return true;
    }
    function rotOld() {
      var n = Math.max(1, items.length - 4);
      items.forEach(function (d, i) { d.g.classList.toggle("faded", i < n); });
      rot.setAttribute("opacity", 1);
      step++;
      update("Bijna vol. De oudste stukken worden vaag: hij vindt details daaruit slechter terug. Dat heet context rot.");
    }
    function compact() {
      if (items.length < 3) return;
      var n = Math.max(2, items.length - 4);
      var old = items.slice(0, n);
      items = items.slice(n);
      old.forEach(function (d) {
        d.g.style.transform = "translate(" + (L.folder[0] + 16) + "px," + (L.folder[1] + 18) + "px) scale(0.3)";
        d.g.style.opacity = "0";
        setTimeout(function () { if (d.g.parentNode) d.g.parentNode.removeChild(d.g); }, reduced ? 0 : 500);
      });
      summary = 60000;
      items.forEach(function (d) { d.g.classList.remove("faded"); });
      folderG.setAttribute("opacity", 1);
      rot.setAttribute("opacity", 0);
      layout();
      step++;
      update("Claude vat de oudste " + n + " stukken samen in één map van 60.000 tokens. Er is weer ruimte, maar kleine details uit die stukken kunnen weg zijn.");
    }
    function clearAll(caption) {
      stop();
      items.forEach(function (d) { if (d.g.parentNode) d.g.parentNode.removeChild(d.g); });
      items = []; summary = null; placed = 0; step = 0;
      folderG.setAttribute("opacity", 0); rot.setAttribute("opacity", 0);
      update(caption || "Een leeg bureau. Druk op Afspelen.");
    }
    function stop() { if (timer) { clearTimeout(timer); timer = null; } }
    function play() {
      clearAll("Afspelen…");
      if (reduced) { while (addDoc()) {} rotOld(); compact(); return; }
      var seq = [];
      DOCS.forEach(function () { seq.push([addDoc, 650]); });
      seq.push([rotOld, 1800]);
      seq.push([compact, 0]);
      var i = 0;
      (function next() {
        if (i >= seq.length) { timer = null; return; }
        var st = seq[i++]; st[0]();
        timer = setTimeout(next, st[1]);
      })();
    }
    document.getElementById("play").addEventListener("click", play);
    document.getElementById("add").addEventListener("click", function () {
      stop(); addDoc();
      if (total() / CAP >= 0.8 && rot.getAttribute("opacity") !== "1") rotOld();
    });
    document.getElementById("compact").addEventListener("click", function () { stop(); compact(); });
    document.getElementById("clear").addEventListener("click", function () { clearAll("Nieuwe chat: schoon bureau. Zijn notitieboekje en de projectmap neemt hij mee."); });
    update();
    if (reduced) {
      // geen beweging: toon meteen het volle bureau en de uitleg in stappen
      document.getElementById("static-steps").hidden = false;
      while (addDoc()) {}
      rotOld();
    } else {
      timer = setTimeout(play, 500); // start bij openen
    }
    return { stop: stop };
  }

  /* ---------- Router en toetsenbord ---------- */
  function route() {
    if (activeBench) { activeBench.stop(); activeBench = null; }
    var h = location.hash || "#/";
    var m = h.match(/^#\/tegel\/([\d.]+)$/);
    if (m) { renderTile(m[1]); window.scrollTo(0, 0); mainEl.focus({ preventScroll: true }); return; }
    if (h === "#/over") { renderAbout(); window.scrollTo(0, 0); return; }
    if (h.indexOf("#/") === 0 || h === "") { renderHome(); return; }
    renderHome(); // gewone ankers zoals #niveau-1
    var target = document.getElementById(h.slice(1)); if (target) target.scrollIntoView();
  }
  window.addEventListener("hashchange", route);
  searchEl.addEventListener("input", function () {
    var leaving = location.hash.indexOf("#/tegel/") === 0 || location.hash === "#/over";
    if (leaving) { if (activeBench) { activeBench.stop(); activeBench = null; } history.pushState(null, "", "#/"); }
    renderHome(!leaving);
  });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    var typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;
    if (e.key === "/" && !typing) { e.preventDefault(); searchEl.focus(); return; }
    if (e.key === "Escape") {
      if (typing && searchEl.value) { searchEl.value = ""; renderHome(); return; }
      if (location.hash.indexOf("#/tegel/") === 0) location.hash = "#/";
      return;
    }
    if (typing || e.altKey || e.ctrlKey || e.metaKey) return;
    var m = (location.hash || "").match(/^#\/tegel\/([\d.]+)$/);
    if (!m) return;
    var t = tileById(m[1]); var i = TILES.indexOf(t);
    if (e.key === "ArrowLeft" && TILES[i - 1]) location.hash = "#/tegel/" + TILES[i - 1].id;
    if (e.key === "ArrowRight" && TILES[i + 1]) location.hash = "#/tegel/" + TILES[i + 1].id;
  });
  route();
})();
</script>
