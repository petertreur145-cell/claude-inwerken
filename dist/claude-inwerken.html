alweer"}}]},{"label":"Een klus","caption":"Claude doet ook zelf werk: hij leest bestanden, rekent met code en levert een bestand op. Jij zegt wat je wilt; hij kiest zelf of het een snel antwoord wordt of een klus.","panes":[{"title":"Servicebezoeken","events":[{"t":"user","text":"Zet de servicebezoeken uit deze export per klanttype op een rij, met een grafiek.","files":[{"name":"export-servicebezoeken.csv","kind":"sheet"}]},{"t":"tool","icon":"terminal","text":"Code uitvoeren: export inlezen (412 regels)"},{"t":"tool","icon":"table","text":"Draaitabel per klanttype"},{"t":"tool","icon":"levels","text":"Grafiek maken"},{"t":"file","name":"servicebezoeken-per-klanttype.xlsx","kind":"sheet","note":"2 tabbladen · 1 grafiek"},{"t":"answer","text":"Klaar. Kantoren hebben de meeste bezoeken; zorginstellingen groeien het snelst."}],"model":"Opus 5.5","verdict":{"tone":"ok","text":"Geen antwoord, maar een bestand"}}]}]},"metafoor":["De briljante nieuwe collega op zijn eerste werkdag. Hij heeft alles gelezen wat er te lezen valt, maar jouw klanten, machines en afspraken kent hij nog niet.","En hij heeft één eigenaardigheid: elke ochtend is hij alles vergeten. Je werkt hem dus elke keer opnieuw in, tenzij je de briefing op papier zet. Hoe dat moet, leer je in niveau 2."],"voorbeelden":[{"soort":"echt","titel":"Claude als winkelier","tekst":"Anthropic liet Claude een maand een winkeltje op kantoor runnen. Hij verzon een betaalrekening, deelde kortingscodes uit, wees $100 voor een sixpack Irn-Bru af en beweerde op 1 april in blazer te komen bezorgen. Met betere hulpmiddelen en een ‘CEO-agent’ ging het in fase twee een stuk beter. Les: slim is nog niet ingewerkt.","bron":{"label":"Anthropic: Project Vend","url":"https://www.anthropic.com/research/project-vend-1"}},{"soort":"numafa","afdeling":"inkoop","titel":"Drie offertes naast elkaar","erin":"Drie offertes van leveranciers voor hetzelfde onderdeel.","claude":"Zet levertijd, garantie, betalingstermijn en voorwaarden naast elkaar.","eruit":"Een vergelijkingstabel plus vijf vragen om na te bellen."},{"soort":"thuis","titel":"Wat eten we vanavond?","erin":"Prei, eieren en een restje kaas.","claude":"Bedenkt drie recepten met wat er is.","eruit":"Een quiche in 40 minuten, met een lijstje voor wat ontbreekt."}],"probeer":{"prompt":"Ik werk bij Numafa, een machinebouwer, op de afdeling [jouw afdeling]. Mijn taken zijn vooral [noem er drie]. Geef me vijf concrete manieren waarop jij me deze week tijd kunt besparen, met per manier een voorbeeldvraag die ik zo kan stellen.","tip":"Vul de stukjes tussen haken in. Merk hoeveel beter het antwoord wordt met die twee zinnen context."},"valkuil":"Claude behandelen als zoekmachine met één los woord. Hij is een collega: geef context en een duidelijke vraag, dan krijg je bruikbaar werk terug.","quiz":[{"vraag":"Je begint een nieuwe chat. Wat weet Claude dan over jouw afdeling?","opties":["Alles wat je in eerdere chats vertelde","Niets, tenzij memory, een project of jijzelf het hem vertelt","Alles wat op het bedrijfsnetwerk staat"],"goed":1,"goedUitleg":"Elk gesprek begint blanco. Memory en projects kunnen de briefing meegeven; anders vertel je het zelf.","foutUitleg":"Claude ziet alleen wat in het gesprek zit, plus wat memory, een project of een gekoppelde app meegeeft."},{"vraag":"Wat helpt het meest voor een goed antwoord?","opties":["Eén kort trefwoord","Context: wie je bent, wat je wilt en waarom","De vraag drie keer herhalen"],"goed":1,"goedUitleg":"Precies. Een goede briefing is het halve werk.","foutUitleg":"Claude doet het meest met context: wie je bent, wat je wilt en waarom."}],"stand":"2026-10-08","bronnen":[{"label":"Claude Docs: Prompting best practices","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"label":"Anthropic: Effective harnesses for long-running agents","url":"https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents"},{"label":"Claude Help Center: Claude Cowork and chat are one Claude","url":"https://support.claude.com/en/articles/16761823-claude-cowork-and-chat-are-one-claude"},{"label":"Anthropic: Project Vend, fase 1","url":"https://www.anthropic.com/research/project-vend-1"},{"label":"Anthropic: Project Vend, fase 2","url":"https://www.anthropic.com/research/project-vend-2"}],"zoekwoorden":["Anthropic","assistent","Cowork","chat","nieuwe collega"]},{"id":"1.2","niveau":1,"titel":"Goed vragen","icoon":"clipboard","minuten":2,"kort":"Een goede briefing: rol, doel, context, vorm en een voorbeeld.","inEenZin":"Een goede instructie is een goede briefing: rol, doel, context, vorm en liefst een voorbeeld.","uitleg":["Anthropic heeft er een gouden regel voor: laat je prompt lezen door een collega die niets van de klus weet. Snapt die het niet, dan Claude ook niet. Vijf ingrediënten helpen: wie hij moet zijn (**rol**), wat je wilt bereiken (**doel**), wat hij moet weten (**context**), hoe het eruit moet zien (**vorm**) en een **voorbeeld** van goed.","Instructies die je vaker nodig hebt, zet je vast neer: in een project (die gelden voor elke chat in dat project) of in Claude Code in `CLAUDE.md`. Houd die algemeen; het specifieke vraag je in de chat zelf."],"visualTitel":"Van vage vraag naar goede briefing","visual":{"type":"chat","scenarios":[{"label":"Vijf ingrediënten","caption":"Eerst de ingrediënten van een goede briefing. Klik ze een voor een aan. Daarna zie je het verschil tussen een vage vraag en een goede briefing.","explain":{"title":"Een goede briefing: vijf ingrediënten","items":[{"name":"Rol","text":"Wie moet hij zijn, en voor wie schrijft hij?","example":"“Je schrijft voor Numafa, nuchter en concreet.”"},{"name":"Doel","text":"Wat moet het opleveren? Wat moet de lezer daarna doen?","example":"“Facilitair managers vragen een proefweek aan.”"},{"name":"Context","text":"Wat moet hij weten dat hij zelf niet kan weten?","example":"“De robot reinigt 's nachts de gangen; eigen schoonmakers blijven.”"},{"name":"Vorm","text":"Hoe moet het eruitzien: lengte, toon, opmaak?","example":"“80 woorden, je-vorm, geen superlatieven.”"},{"name":"Voorbeeld","text":"Laat zien hoe goed eruitziet. Anthropic raadt 3 tot 5 voorbeelden aan.","example":"een eerder stuk dat je goed vond, als bijlage."}],"foot":"**Gouden regel** van Anthropic: zou een collega die niets van de klus weet je vraag snappen? Zo niet, dan Claude ook niet.","exampleLabel":"Bijvoorbeeld"}},{"label":"Vaag of gebriefd","caption":"Links een vage vraag, rechts dezelfde vraag met de vijf ingrediënten. Onder Briefing zie je welke gaten gevuld zijn: nu weet Claude voor wie, waarom en hoe.","panes":[{"title":"Nieuwe chat","events":[{"t":"user","text":"Schrijf een tekst over onze schoonmaakrobot."},{"t":"side-mark","index":0,"tone":"bad"},{"t":"side-mark","index":1,"tone":"bad"},{"t":"side-mark","index":2,"tone":"bad"},{"t":"side-mark","index":3,"tone":"bad"},{"t":"side-mark","index":4,"tone":"bad"},{"t":"answer","text":"Maak kennis met de toekomst van schoonmaken!\nOnze innovatieve robot maakt uw vloeren moeiteloos schoon, dag en nacht…"},{"t":"note","tone":"warn","text":"Voor wie? Waarvoor? Hoe lang? Claude moet gokken."}],"model":"Opus 5.5","side":{"title":"Briefing","items":[{"text":"Rol","tone":"muted"},{"text":"Doel","tone":"muted"},{"text":"Context","tone":"muted"},{"text":"Vorm","tone":"muted"},{"text":"Voorbeeld","tone":"muted"}]},"verdict":{"tone":"warn","text":"Algemeen, niet te gebruiken"},"label":"Vaag"},{"title":"Nieuwe chat","events":[{"t":"user","text":"**Rol:** je schrijft voor Numafa, nuchter en concreet.\n**Doel:** facilitair managers vragen een proefweek aan.\n**Context:** de robot reinigt 's nachts de gangen; eigen schoonmakers blijven.\n**Vorm:** 80 woorden, je-vorm, geen superlatieven.\n**Voorbeeld:** onze toon staat in de bijlage.","files":[{"name":"nieuwsbrief-voorbeeld.docx","kind":"doc"}]},{"t":"side-mark","index":0,"tone":"ok"},{"t":"side-mark","index":1,"tone":"ok"},{"t":"side-mark","index":2,"tone":"ok"},{"t":"side-mark","index":3,"tone":"ok"},{"t":"side-mark","index":4,"tone":"ok"},{"t":"answer","text":"Elke ochtend schone gangen, zonder extra mensen.\nOnze schoonmaakrobot werkt 's nachts. Je eigen schoonmakers houden overdag tijd over voor de rest.\nProbeer het een week op je eigen locatie: vraag een proefweek aan bij je accountmanager."}],"model":"Opus 5.5","side":{"title":"Briefing","items":[{"text":"Rol","tone":"muted"},{"text":"Doel","tone":"muted"},{"text":"Context","tone":"muted"},{"text":"Vorm","tone":"muted"},{"text":"Voorbeeld","tone":"muted"}]},"verdict":{"tone":"ok","text":"In één keer raak"},"label":"Gebriefd"}]},{"label":"Zeg waarom","caption":"Leg uit waarom je iets wilt. Dan snapt Claude het doel en doet hij ook wat je niet letterlijk noemde. Anthropic raadt dit zelf aan.","panes":[{"title":"Claude","events":[{"t":"user","text":"Schrijf de veiligheidsinstructie zonder afkortingen."},{"t":"answer","text":"Alvorens de machine in werking te stellen, dient men zich ervan te vergewissen dat de borstelkop correct is bevestigd en de tank niet boven het maximale niveau is gevuld."}],"label":"Alleen de regel","model":"Opus 5.5","verdict":{"tone":"warn","text":"Regel gevolgd, doel gemist"}},{"title":"Claude","events":[{"t":"user","text":"Schrijf de veiligheidsinstructie zonder afkortingen. Hij komt als sticker op de machine, voor schoonmakers die vaak geen Nederlands als moedertaal hebben."},{"t":"answer","text":"1. Zet de machine uit.\n2. Zit de borstel goed vast?\n3. Vul de tank tot de streep. Niet hoger.\n4. Zet de machine aan."}],"label":"Regel **plus waarom**","model":"Opus 5.5","verdict":{"tone":"ok","text":"Snapt het doel: korte zinnen, stappen"}}]},{"label":"Mag ‘weet ik niet’ zeggen","caption":"Geef Claude toestemming om te zeggen dat hij iets niet weet. Volgens Anthropic vermindert dat verzonnen antwoorden flink. Nog beter: geef de bron mee en vraag om een citaat. (De RX-40 is een verzonnen machine.)","panes":[{"title":"Claude","events":[{"t":"user","text":"Hoeveel m² haalt de RX-40 op één acculading?"},{"t":"answer","text":"De RX-40 haalt ongeveer 2.400 m² per acculading."},{"t":"note","tone":"bad","text":"Klinkt stellig, maar is verzonnen."}],"label":"Zonder toestemming","model":"Opus 5.5","verdict":{"tone":"bad","text":"Een verzonnen antwoord"}},{"title":"Claude","events":[{"t":"user","text":"Hoeveel m² haalt de RX-40 op één acculading? Weet je het niet zeker, zeg dat dan."},{"t":"answer","text":"Dat weet ik niet zeker: de specificaties van de RX-40 heb ik niet.\nUpload de handleiding, dan zoek ik het op en citeer ik de passage."}],"label":"Met toestemming","model":"Opus 5.5","verdict":{"tone":"ok","text":"Eerlijk, met een route naar het goede antwoord"}}]}]},"metafoor":["De briefing aan de nieuwe collega. Zeg je alleen “regel jij die mail even?”, dan gaat hij gokken. Vertel je wie hij is, wat het doel is, wat er speelt en hoe het eruit moet zien, dan levert hij in één keer.","Gebruik de gouden regel: zou een collega die net binnenkomt jouw briefing snappen?"],"voorbeelden":[{"soort":"echt","titel":"De stagiair op dag één","tekst":"Anthropic adviseert bedrijven: “Think of Claude as an intern on their first day of the job: provide clear, explicit instructions with all the necessary detail.”","bron":{"label":"Anthropic: Prompt engineering for business performance","url":"https://www.anthropic.com/news/prompt-engineering-for-business-performance"}},{"soort":"echt","titel":"De gouden regel","tekst":"Uit de officiële promptgids: “Show your prompt to a colleague with minimal context on the task and ask them to follow it. If they'd be confused, Claude will be too.”","bron":{"label":"Claude Docs: Prompting best practices","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}},{"soort":"numafa","afdeling":"inkoop","titel":"Van vaag naar precies","erin":"“Je bent inkoper bij Numafa. Schrijf leverancier X, vriendelijk maar zakelijk, dat de levering van week 42 te laat is. Vraag vóór vrijdag een nieuwe datum. Maximaal 120 woorden.”","claude":"Weet nu wie hij is, wat het doel is en hoe lang het mag zijn.","eruit":"Een mail die je met één kleine aanpassing kunt versturen."},{"soort":"thuis","titel":"Weekendje weg","tekst":"“Plan een weekend Antwerpen” geeft een folder. Met budget, wie er meegaat en “geen musea” krijg je een plan dat bij jou past."}],"probeer":{"prompt":"Hier is een vraag die ik aan je wil stellen: [plak je vraag]. Stel me eerst maximaal vijf vragen over rol, doel, context en vorm, zodat je precies begrijpt wat ik nodig heb. Beantwoord hem pas daarna.","tip":"Handig trucje: laat Claude zelf de ontbrekende briefing ophalen."},"valkuil":"Te veel tegelijk vragen in één prompt. Liever één duidelijke taak per bericht, en daarna bijsturen: “korter”, “formeler”, “zonder opsomming”.","quiz":[{"vraag":"Wat is de gouden regel van Anthropic voor een goede prompt?","opties":["Schrijf altijd in het Engels","Laat je prompt lezen door een collega zonder voorkennis: snapt die het niet, dan Claude ook niet","Hoe korter de prompt, hoe beter"],"goed":1,"goedUitleg":"Precies. Een collega die net binnenkomt is de beste toets.","foutUitleg":"De gouden regel: zou een collega zonder voorkennis je prompt snappen?"},{"vraag":"Wat ontbreekt in: “Schrijf een mail aan de leverancier over de late levering, maximaal 100 woorden”?","opties":["De lengte","Wat de mail moet bereiken, zoals een nieuwe leverdatum","Het onderwerp"],"goed":1,"goedUitleg":"Klopt. Zonder doel weet hij niet wat de mail moet opleveren.","foutUitleg":"Lengte en onderwerp staan er al in. Het doel ontbreekt: wat moet de mail opleveren?"}],"stand":"2026-10-08","bronnen":[{"label":"Claude Docs: Prompting best practices","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"label":"Anthropic: Prompt engineering for business performance","url":"https://www.anthropic.com/news/prompt-engineering-for-business-performance"},{"label":"Claude Help Center: What are projects?","url":"https://support.claude.com/en/articles/9517075-what-are-projects"},{"label":"Claude Code Docs: How Claude remembers your project","url":"https://code.claude.com/docs/en/memory"},{"label":"Claude Docs: Reduce hallucinations","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations"}],"zoekwoorden":["prompt","briefing","instructies","gouden regel","rol","doel","prompten","voorbeelden","weet ik niet","hallucinatie","verzinnen"],"tips":["**Gouden regel:** zou een collega die niets van de klus weet je vraag snappen? Zo niet, dan Claude ook niet.","**Rol, doel, context, vorm, voorbeeld.** Niet elke vraag heeft ze alle vijf nodig; een belangrijke klus wel.","**Zeg waarom.** “Het komt op een sticker voor schoonmakers” werkt beter dan alleen “geen afkortingen”.","**Zeg wat wél.** “Korte zinnen, je-vorm” werkt beter dan “niet te lang, niet te formeel”.","**Geef voorbeelden.** Anthropic raadt er 3 tot 5 aan. Zet lange documenten bovenaan en je vraag eronder.","**Ruimte voor ‘weet ik niet’.** Gaat het om feiten, geef dan de bron mee en vraag om citaten.","**Geen hoofdletters of ‘ABSOLUUT’ nodig.** Nieuwe modellen volgen rustige instructies goed; te fel maakt ze juist overijverig."]},{"id":"1.3","niveau":1,"titel":"Modellen","icoon":"levels","minuten":2,"kort":"Vier ervaringsniveaus, van snelle junior tot topexpert. En waarom Mythos achter slot zit.","inEenZin":"Claude komt in vier ervaringsniveaus: Haiku is de snelle junior, Fable de topexpert, en hoe zwaarder de klus, hoe hoger je kiest.","uitleg":["Per 8 oktober 2026 zijn er vier modellen. **Haiku 5.5** is de snelste, voor veel simpel werk zoals sorteren en samenvatten. **Sonnet 5.5** combineert snelheid en slimheid. **Opus 5.5** is volgens Anthropic het startpunt voor het meeste werk. **Fable 5.1** is de zwaarste, voor lastig redeneerwerk en lange klussen, en ook de traagste.","Fable heeft extra veiligheidsregels voor cybersecurity en biologie. Hetzelfde model zonder die regels heet **Mythos**, en dat krijgen alleen gescreende organisaties. Anthropic: het is zo sterk in beveiligings- en biologieonderzoek dat het zowel voor goed als voor kwaad gebruikt kan worden."],"tabel":{"kolommen":["Model","Ervaringsniveau","Sterk in","Snelheid"],"rijen":[["Haiku 5.5","Snelle junior","Veel kleine klussen: sorteren, samenvatten, labelen","Snelst"],["Sonnet 5.5","Ervaren allrounder","Dagelijks werk waar snelheid én kwaliteit tellen","Snel"],["Opus 5.5","Senior specialist","Lang lopend kennis- en programmeerwerk","Gemiddeld"],["Fable 5.1","Topexpert met extra veiligheidsregels","Lastig redeneren, klussen van uren","Trager"],["Mythos 5.1","Dezelfde topexpert, zonder die regels","Alleen voor gescreende organisaties","Niet publiek"]]},"visualTitel":"Wie krijgt de klus?","visual":{"type":"chat","scenarios":[{"label":"De vier modellen","caption":"Eerst de vier modellen. Klik er een aan: je ziet hoe snel en hoe sterk hij is, en waarvoor je hem gebruikt. Daarna zie je ze aan het werk.","explain":{"title":"Vier modellen, van snel tot zwaar","items":[{"name":"Haiku 5.5","sub":"de snelle junior","text":"De snelste. Voor veel simpel werk.","bars":[1,0.35,0.1],"use":"sorteren, samenvatten, korte vragen."},{"name":"Sonnet 5.5","sub":"de vlotte allrounder","text":"Combineert snelheid en slimheid.","bars":[0.75,0.6,0.3],"use":"dagelijks werk waarbij tempo telt."},{"name":"Opus 5.5","sub":"de ervaren collega","text":"Volgens Anthropic het startpunt voor het meeste werk.","bars":[0.55,0.8,0.55],"use":"teksten, analyses en documenten. Twijfel je? Begin hier."},{"name":"Fable 5.1","sub":"de topexpert","text":"De zwaarste en de traagste. Voor lastig redeneerwerk en lange klussen.","bars":[0.25,1,0.9],"use":"moeilijke analyses en lange, zelfstandige klussen."}],"bars":["Snelheid","Denkkracht","Verbruik"],"foot":"De balkjes zijn een indicatie. **Mythos** is hetzelfde model als Fable, maar zonder de extra veiligheidsregels; dat krijgen alleen gescreende organisaties. Je kiest het model naast de verzendknop."}},{"label":"Simpel werk","caption":"Veertig mails sorteren is routine. Haiku doet het in een paar seconden. Fable komt op hetzelfde uit, maar denkt lang na en kost meer van je limiet.","panes":[{"title":"Claude","events":[{"t":"user","text":"Sorteer deze 40 mails in: offerte, storing, factuur, overig.","files":[{"name":"40 mails","kind":"mail"}]},{"t":"answer","text":"Offerte 9 · Storing 14 · Factuur 11 · Overig 6\nDe lijst per categorie staat hieronder."}],"label":"**Haiku 5.5**: de snelle junior","model":"Haiku 5.5","meter":{"sec":4,"usage":0.03},"verdict":{"tone":"ok","text":"Snel en goed genoeg"}},{"title":"Claude","events":[{"t":"user","text":"Sorteer deze 40 mails in: offerte, storing, factuur, overig.","files":[{"name":"40 mails","kind":"mail"}]},{"t":"thinking","lines":["Eerst de categorieën scherp afbakenen.","Mail 23 gaat over een storing én een factuur…","Ik loop alles nog een keer na."],"secs":48},{"t":"answer","text":"Offerte 9 · Storing 14 · Factuur 11 · Overig 6\nDe lijst per categorie staat hieronder."}],"label":"**Fable 5.1**: de topexpert","model":"Fable 5.1","meter":{"sec":52,"usage":0.35},"verdict":{"tone":"warn","text":"Zelfde uitkomst, trager en zwaarder"}}]},{"label":"Zware klus","caption":"Een jaar storingsmeldingen doorzoeken op verborgen patronen. Hier verdient Fable zijn extra tijd terug: hij graaft dieper en vindt wat een snellere collega mist.","panes":[{"title":"Claude","events":[{"t":"user","text":"Zoek patronen in de storingsmeldingen van het afgelopen jaar.","files":[{"name":"storingen-2025.xlsx","kind":"sheet"}]},{"t":"tool","icon":"terminal","text":"Code uitvoeren: 1.240 meldingen"},{"t":"answer","text":"Meeste storingen bij type B (38%).\nPiek in januari en februari."}],"label":"**Sonnet 5.5**: snel en slim","model":"Sonnet 5.5","meter":{"sec":40,"usage":0.15},"verdict":{"tone":"warn","text":"Goed overzicht, maar aan de oppervlakte"}},{"title":"Claude","events":[{"t":"user","text":"Zoek patronen in de storingsmeldingen van het afgelopen jaar.","files":[{"name":"storingen-2025.xlsx","kind":"sheet"}]},{"t":"thinking","lines":["Type B valt op, maar waarom?","Meldingen naast de onderhoudsdata leggen.","Piek steeds rond twee weken na een software-update."],"secs":140},{"t":"tool","icon":"terminal","text":"Code uitvoeren: meldingen + onderhoudslog"},{"t":"tool","icon":"check","text":"Controle: patroon klopt in elke regio","tone":"ok"},{"t":"answer","text":"Type B faalt vooral 10 tot 14 dagen na een software-update.\nAdvies: plan na elke update een controlebezoek."}],"label":"**Fable 5.1**: de topexpert","model":"Fable 5.1","meter":{"sec":420,"usage":0.55},"verdict":{"tone":"ok","text":"Trager, maar vindt de echte oorzaak"}}]}]},"metafoor":["Vier ervaringsniveaus op de werkvloer. Haiku is de snelle junior die in een uur een stapel sorteert. Sonnet is de ervaren allrounder. Opus is de senior specialist voor het lastige werk. Fable is de topexpert, met extra veiligheidsregels.","Mythos is diezelfde topexpert zonder die regels. Die werkt alleen achter een beveiligde deur, voor wie een pasje heeft gekregen."],"voorbeelden":[{"soort":"echt","titel":"Een fout van 27 jaar oud","tekst":"Mythos Preview vond een 27 jaar oude fout in OpenBSD, een van de best beveiligde besturingssystemen ter wereld. Daarmee kon je elke OpenBSD-server via het netwerk laten crashen. De fout is inmiddels gedicht. Precies daarom is dit model niet voor iedereen.","bron":{"label":"Anthropic red team: Mythos Preview","url":"https://red.anthropic.com/2026/mythos-preview/"}},{"soort":"echt","titel":"38 uur doorwerken","tekst":"Volgens Ramp werkte Fable 5.1 38 uur zonder toezicht door. Hij ontdekte dat een eerder resultaat op een labelfout berustte en draaide ’s nachts zes experimenten tegelijk.","bron":{"label":"Anthropic: Claude Fable 5.1 en Mythos 5.1","url":"https://www.anthropic.com/claude-fable-and-mythos-5-1"}},{"soort":"numafa","afdeling":"magazijn","titel":"Rommelige artikelomschrijvingen","erin":"400 rommelige artikelomschrijvingen uit het ERP.","claude":"Haiku deelt ze in per productgroep.","eruit":"Een nieuwe kolom voor Excel, in een paar minuten."}],"probeer":{"prompt":"Schrijf een korte, vriendelijke mail aan een leverancier: de levering van week 42 is te laat en we willen vóór vrijdag een nieuwe datum. Maximaal 100 woorden.","tip":"Stuur deze prompt één keer met Haiku en één keer met Opus (kies het model naast de verzendknop). Voor zo'n mail is de snelle versie vaak al prima."},"valkuil":"Altijd het zwaarste model kiezen ‘voor de zekerheid’. Fable en Opus zijn trager en gaan harder van je limiet af. Op een Pro- of standaard Team-abonnement betaal je Fable zelfs apart, met usage credits.","quiz":[{"vraag":"Je moet 300 klantmails in vijf categorieën sorteren. Welk model past het best?","opties":["Haiku","Fable","Mythos"],"goed":0,"goedUitleg":"Veel simpel werk in bulk: daar is Haiku voor gemaakt.","foutUitleg":"Voor veel simpel werk is Haiku het snelst en goedkoopst. Mythos is niet eens publiek."},{"vraag":"Waarom is Mythos niet publiek?","opties":["Het is nog niet af","Het is zo sterk in cybersecurity en biologie dat het ook voor kwaad gebruikt kan worden","Het spreekt alleen Engels"],"goed":1,"goedUitleg":"Klopt. Daarom krijgt alleen een gescreende groep organisaties toegang.","foutUitleg":"Anthropic houdt Mythos achter slot omdat het zowel voor goed als voor kwaad gebruikt kan worden."}],"stand":"2026-10-08","bronnen":[{"label":"Claude Docs: Models overview","url":"https://platform.claude.com/docs/en/about-claude/models/overview"},{"label":"Claude Docs: Claude Fable 5.1","url":"https://platform.claude.com/docs/en/models/fable-5-1/overview"},{"label":"Anthropic: Claude Mythos","url":"https://www.anthropic.com/claude/mythos"},{"label":"Anthropic: Claude Fable 5.1 en Mythos 5.1","url":"https://www.anthropic.com/claude-fable-and-mythos-5-1"},{"label":"Claude Help Center: Claude Fable models on your plan","url":"https://support.claude.com/en/articles/15424964-claude-fable-models-on-your-plan"},{"label":"Anthropic red team: Mythos Preview","url":"https://red.anthropic.com/2026/mythos-preview/"}],"zoekwoorden":["Haiku","Sonnet","Opus","Fable","Mythos","model","Glasswing"]},{"id":"1.4","niveau":1,"titel":"Thinking, effort en fast mode","icoon":"effort","minuten":2,"kort":"Direct antwoorden of eerst nadenken, en hoe lang.","inEenZin":"Jij bepaalt hoe lang Claude nadenkt voordat hij antwoordt; in Claude Code kun je hem tegen meerprijs ook sneller laten werken.","uitleg":["Naast het model kies je de **effort**: Low, Medium, High, Extra high of Max. Hoe hoger, hoe grondiger, maar ook trager en zwaarder voor je limiet. En hoger is niet altijd beter: bij een kleine klus gaat hij overdenken en past hij soms meer aan dan je vroeg. Zijn denkstappen (**thinking**) zie je uitklapbaar boven het antwoord. Bij de nieuwste modellen staat thinking altijd aan; ze bepalen zelf hoeveel ze nadenken, gestuurd door de effort.","**Fast mode** bestaat alleen in Claude Code, voor Opus: zelfde kwaliteit, tot 2,5 keer sneller, maar duurder. Je betaalt het uit usage credits, en bij Team en Enterprise moet een beheerder het eerst aanzetten."],"visualTitel":"Eerst nadenken: thinking en effort","visual":{"type":"chat","scenarios":[{"label":"Wat is thinking?","caption":"**Thinking** is het nadenken vóór het antwoord. De denkstappen staan boven het antwoord, zodat je ziet hoe hij erop kwam. Bij de nieuwste modellen staat het altijd aan. Hoe lang hij nadenkt, stuur je met de effort.","panes":[{"title":"Nieuwe chat","events":[{"t":"user","text":"Waarom valt een transportband af en toe stil terwijl de motor gewoon draait?"},{"t":"thinking","lines":["Motor draait, band staat stil: de kracht komt niet aan bij de band.","Slipt de aandrijfrol? Of zit de koppeling los?","Het kan ook een sensor zijn die de band even stopt."],"secs":12},{"t":"answer","text":"Drie waarschijnlijke oorzaken:\n1. Een slippende aandrijfrol, door vuil of slijtage\n2. Een losse koppeling of spie in de aandrijving\n3. Een sensor of noodstop die even onderbreekt"},{"t":"note","tone":"info","text":"In de app klap je de denkstappen open en dicht."}],"model":"Opus 5.5","verdict":{"tone":"ok","text":"Eerst nadenken, dan antwoorden"}}]},{"label":"De vijf standen","caption":"**Effort** bepaalt hoe grondig hij nadenkt. Klik een stand aan: hoe hoger, hoe meer nadenken, maar ook trager en zwaarder voor je limiet. Daarna zie je wat dat in de praktijk doet.","explain":{"title":"Effort: hoe grondig denkt hij na?","items":[{"name":"Low","sub":"snel en zuinig","text":"Denkt kort na en doet precies wat je vraagt. Het snelst, en het zuinigst met je limiet.","bars":[0.15,0.1,0.1],"use":"kleine, duidelijke klussen: een kop aanpassen, een mail inkorten, iets omzetten."},{"name":"Medium","sub":"de middenweg","text":"Balans tussen snelheid en grondigheid. Bij Opus 5.5 de standaard in Claude Code.","bars":[0.4,0.3,0.3],"use":"het meeste dagelijkse werk."},{"name":"High","sub":"grondig","text":"Denkt zo lang als de klus nodig heeft. Trager, en je limiet gaat sneller op.","bars":[0.65,0.55,0.55],"use":"lastig denkwerk: vergelijken, fouten zoeken, opties afwegen."},{"name":"Extra high","sub":"extra grondig","text":"Voor lange, zware klussen waar hij zelfstandig aan doorwerkt.","bars":[0.85,0.8,0.8],"use":"lange klussen in Claude Code, zoals een tool bouwen."},{"name":"Max","sub":"alles erop en eraan","text":"Geen rem op nadenken of verbruik. Volgens Anthropic kost het bij de meeste klussen veel voor weinig extra kwaliteit, en kan het leiden tot overdenken.","bars":[1,1,1],"use":"alleen het allerzwaarste denkwerk."}],"bars":["Nadenken","Tijd","Verbruik"],"foot":"Waar zet je het? In de Claude-app: klik op het model naast de verzendknop, dan Effort. In Claude Code: `/effort`. **Ultracode** (alleen Claude Code) is geen stand maar een extra: dan zet Claude voor grote klussen een ploeg hulpagenten in."}},{"label":"Kleine klus op Max","caption":"Een kleine wijziging op Max: Claude gaat overdenken, doet er lang over en past veel meer aan dan je vroeg. Op Low doet hij precies wat er staat. Ultracode in Claude Code gaat nog verder: dat zet voor grotere klussen een hele ploeg hulpagenten in.","panes":[{"title":"Claude","events":[{"t":"user","text":"Maak de kop van deze werkinstructie iets groter.","files":[{"name":"werkinstructie-borstels.docx","kind":"doc"}]},{"t":"answer","text":"Kop aangepast van 20 naar 24 pt."},{"t":"diff","title":"werkinstructie-borstels.docx","lines":[["-","Kop: 20 pt"],["+","Kop: 24 pt"]]}],"label":"Effort **Low**","model":"Opus 5.5 · Low","meter":{"sec":3,"usage":0.03,"extra":"1 wijziging"},"verdict":{"tone":"ok","text":"Precies wat je vroeg"}},{"title":"Claude","events":[{"t":"user","text":"Maak de kop van deze werkinstructie iets groter.","files":[{"name":"werkinstructie-borstels.docx","kind":"doc"}]},{"t":"thinking","lines":["Kop groter… dan klopt de verhouding met de subkoppen niet meer.","Subkoppen dus ook groter?","Dan worden de marges te krap.","Het lettertype is eigenlijk ook niet ideaal.","Ik maak de hele opmaak consistent."],"secs":95},{"t":"answer","text":"Ik heb de opmaak in één keer consistent gemaakt:\nkop, subkoppen, lettertype, marges en regelafstand."},{"t":"diff","title":"werkinstructie-borstels.docx","lines":[["-","Kop: 20 pt"],["+","Kop: 26 pt"],["-","Subkoppen: 14 pt"],["+","Subkoppen: 17 pt"],["-","Lettertype: Calibri"],["+","Lettertype: Aptos"],["-","Marges: 2,0 cm"],["+","Marges: 2,5 cm"],[" ","… en nog 10 wijzigingen"]]}],"label":"Effort **Max**","model":"Opus 5.5 · Max","meter":{"sec":95,"usage":0.6,"extra":"14 wijzigingen"},"verdict":{"tone":"warn","text":"Duurde lang en paste veel meer aan dan gevraagd"}}]},{"label":"Lastige klus op Low","caption":"Andersom kan ook. Bij een lastige vergelijking kijkt Low te snel en mist hij iets. Hier loont High: grondig waar het nodig is.","panes":[{"title":"Claude","events":[{"t":"user","text":"Vergelijk de offerte met de inkooporder. Wat wijkt af?","files":[{"name":"offerte.pdf","kind":"pdf"},{"name":"inkooporder.xlsx","kind":"sheet"}]},{"t":"answer","text":"Alleen de leverdatum wijkt af: 14 in plaats van 10 november."}],"label":"Effort **Low**","model":"Opus 5.5 · Low","meter":{"sec":5,"usage":0.04,"extra":"1 verschil"},"verdict":{"tone":"warn","text":"Snel, maar mist twee verschillen"}},{"title":"Claude","events":[{"t":"user","text":"Vergelijk de offerte met de inkooporder. Wat wijkt af?","files":[{"name":"offerte.pdf","kind":"pdf"},{"name":"inkooporder.xlsx","kind":"sheet"}]},{"t":"thinking","lines":["Regels één voor één naast elkaar leggen.","Regel 7: aantal klopt, de staffelkorting niet.","Verzendkosten staan alleen in de offerte."],"secs":34},{"t":"answer","text":"Drie verschillen:\n1. Leverdatum: 14 in plaats van 10 november\n2. Regel 7: staffelkorting ontbreekt in de offerte\n3. Verzendkosten staan niet in de inkooporder"}],"label":"Effort **High**","model":"Opus 5.5 · High","meter":{"sec":38,"usage":0.2,"extra":"3 verschillen"},"verdict":{"tone":"ok","text":"Grondig waar het nodig is"}}]}]},"metafoor":["Vraag je de nieuwe collega iets, dan kan hij direct antwoorden of eerst even nadenken. Effort is hoeveel tijd hij daarvoor neemt: een snelle reactie bij de koffieautomaat, of een middag met de tekeningen op tafel.","Fast mode is dezelfde collega met de turbo aan. Hij denkt even goed na, maar typt sneller. Dat kost wel extra."],"voorbeelden":[{"soort":"echt","titel":"Robothond in negen minuten","tekst":"Collega's van Anthropic zonder robotica-ervaring programmeerden een robothond. Zeven maanden later deed Opus 4.7 in Claude Code, met effort op max, dezelfde taken in 9,5 minuut. Het snelste mensenteam had 181 minuten nodig.","bron":{"label":"Anthropic: Project Fetch, fase 2","url":"https://www.anthropic.com/research/project-fetch-phase-two"}},{"soort":"numafa","afdeling":"service","titel":"Vertalen of analyseren","erin":"Een klantmail in het Duits, en later de logs en het schema van een pomp die na 20 minuten afslaat.","claude":"Vertaalt op Low; analyseert de storing op High of Extra high.","eruit":"Een vertaling binnen seconden, en een onderbouwde lijst met mogelijke oorzaken plus een meetplan."},{"soort":"thuis","titel":"Snel of grondig","tekst":"Low: “Hoeveel gram is 3 cups bloem?” High: “Plan een moestuin met wisselteelt voor vier jaar.”"}],"probeer":{"prompt":"Bedenk drie mogelijke oorzaken waarom een transportband af en toe stilvalt terwijl de motor gewoon draait, en zet ze op volgorde van waarschijnlijkheid.","tip":"Stuur deze vraag op Low en daarna op High (klik op het model naast de verzendknop, dan Effort). Klap de denkstappen uit en vergelijk."},"valkuil":"Alles op Max (of in Claude Code op ultracode) zetten. Voor simpel werk wordt het antwoord niet beter: het duurt langer, hij doet vaak meer dan je vroeg en je limiet is sneller op. Begin bij de standaard en schroef alleen op als het antwoord te oppervlakkig is.","quiz":[{"vraag":"Je vraagt op Max: “maak de kop iets groter”. Wat is de kans?","opties":["Hij gaat overdenken, doet er lang over en past meer aan dan je vroeg","Hij weigert, omdat de klus te klein is","Het resultaat is gegarandeerd beter dan op Low"],"goed":0,"goedUitleg":"Precies. Max is voor het zwaarste denkwerk; bij een kleine klus kost het vooral tijd en limiet.","foutUitleg":"Max maakt een kleine klus niet beter. Hij gaat overdenken, het duurt lang en hij past vaak meer aan dan je vroeg."},{"vraag":"Waar vind je fast mode?","opties":["In elke chat in de Claude-app","Alleen in Claude Code, voor Opus","Alleen op de telefoon"],"goed":1,"goedUitleg":"Klopt. En het wordt betaald uit usage credits.","foutUitleg":"Fast mode zit alleen in Claude Code, voor Opus, en wordt betaald uit usage credits."}],"stand":"2026-10-08","bronnen":[{"label":"Claude Help Center: Change the model, effort, and thinking settings","url":"https://support.claude.com/en/articles/8664678-change-the-model-effort-and-thinking-settings"},{"label":"Claude Docs: Models overview (adaptive thinking)","url":"https://platform.claude.com/docs/en/about-claude/models/overview"},{"label":"Claude Code Docs: Fast mode","url":"https://code.claude.com/docs/en/fast-mode"},{"label":"Anthropic: Project Fetch, fase 2","url":"https://www.anthropic.com/research/project-fetch-phase-two"},{"label":"Claude Docs: Effort","url":"https://platform.claude.com/docs/en/build-with-claude/effort"},{"label":"Claude Code Docs: Model configuration (effort en ultracode)","url":"https://code.claude.com/docs/en/model-config"}],"zoekwoorden":["effort","thinking","denken","fast mode","/effort","/fast","snelheid","max","ultracode","overdenken"],"tips":["**Laat de standaard staan** voor het meeste werk. Schroef pas op als het antwoord te oppervlakkig is.","**Low** voor kleine, duidelijke klussen: een kop aanpassen, een mail inkorten, iets omzetten. Hoe lager, hoe meer hij zich houdt aan precies wat je vroeg.","**High** voor lastig denkwerk: vergelijken, fouten zoeken, opties afwegen.","**Extra high en Max** alleen voor het zwaarste werk. Volgens Anthropic kost Max meestal veel voor weinig extra kwaliteit, en kan het tot overdenken leiden.","**Fast mode** (alleen Claude Code) als tijd echt geld waard is, zoals bij een haastklus."]},{"id":"1.5","niveau":1,"titel":"Context window","icoon":"desk","minuten":2,"kort":"Zijn bureau: wat erop ligt ziet hij, te vol en hij raakt het overzicht kwijt.","inEenZin":"Het context window is het werkgeheugen van één gesprek: alles wat erin zit ziet Claude, maar hoe voller het is, hoe slechter hij dingen terugvindt.","uitleg":["Alles in een gesprek telt mee: jouw vragen, zijn antwoorden, geplakte mails en geüploade pdf's. Claude meet dat in **tokens**; een token is ongeveer een half woord. De huidige modellen kunnen 1 miljoen tokens aan, zo'n 555.000 woorden.","Dat is veel, maar vol is niet hetzelfde als handig. Hoe meer er ligt, hoe slechter hij losse details terugvindt. Anthropic noemt dat *context rot*. Raakt het vol, dan vat Claude oudere berichten automatisch samen. Dat werkt, maar details kunnen sneuvelen. Dus: één onderwerp per gesprek, en voor iets nieuws een nieuwe chat."],"visualTitel":"Het bureau dat volloopt","visual":{"type":"desk"},"metafoor":["Zie het als zijn bureau. Wat erop ligt, ziet hij meteen. Leg je er een handleiding van 300 pagina's, drie mailthreads en een Excel-export bij, dan ligt alles er nog wel, maar zoekt hij zich suf naar dat ene briefje van vanochtend.","Een nieuwe chat is een schoon bureau. Zijn notitieboekje (memory) en de projectmap neemt hij wel mee."],"voorbeelden":[{"soort":"echt","titel":"Claude speelt Pokémon","tekst":"Een potje Pokémon duurt veel langer dan in één context past. Claude begon uit zichzelf notities bij te houden: kaarten van verkende gebieden, behaalde mijlpalen, welke aanval tegen welke tegenstander werkt. Niemand had erom gevraagd.","bron":{"label":"Anthropic: Effective context engineering","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"}},{"soort":"numafa","afdeling":"engineering","titel":"De handleiding van 300 pagina's","erin":"De machinehandleiding (pdf) en de vraag: “Welk aanhaalmoment geldt voor de pompflens?”","claude":"Zoekt het juiste hoofdstuk op het volle bureau.","eruit":"De waarde mét paginanummer, zodat je het zelf nakijkt."},{"soort":"thuis","titel":"De vakantiechat van twee weken","erin":"Twee weken heen-en-weer over de zomervakantie.","claude":"Begint te vergeten dat de hond mee moet.","eruit":"Laat een samenvatting maken, plak die in een nieuwe chat, en hij is weer scherp."}],"probeer":{"prompt":"Vat ons gesprek tot nu toe samen in maximaal 10 punten: wat is besloten, wat staat nog open, en welke getallen en namen zijn belangrijk. Schrijf het zo dat ik het in een nieuwe chat kan plakken en daar meteen verder kan.","tip":"Plak dit aan het eind van een lang gesprek. Open daarna een nieuwe chat en plak de samenvatting erin. In Claude Code doet `/compact` iets vergelijkbaars."},"valkuil":"Eén eindeloze chat ‘omdat alles er toch in staat’. Juist daardoor gaat hij details missen of door elkaar halen. Nieuw onderwerp? Nieuwe chat.","quiz":[{"vraag":"Je chat al drie weken in één gesprek over een project en Claude haalt oude afspraken door elkaar. Wat helpt het meest?","opties":["Effort op Max zetten","Een samenvatting laten maken en verder in een nieuwe chat","Alle documenten nog een keer plakken","Overstappen op Haiku"],"goed":1,"goedUitleg":"Een samenvatting in een nieuwe chat geeft hem een schoon bureau met alleen wat telt.","foutUitleg":"Meer denkkracht of meer papier helpt niet als het bureau al te vol ligt. Begin schoon met een samenvatting."},{"vraag":"Wat telt mee in het context window?","opties":["Alleen jouw vragen","Alleen geüploade bestanden","Alles in het gesprek: vragen, antwoorden en bestanden"],"goed":2,"goedUitleg":"Klopt. Ook zijn eigen antwoorden liggen op het bureau.","foutUitleg":"Bijna. Alles in het gesprek telt mee, ook zijn eigen antwoorden."}],"stand":"2026-10-08","bronnen":[{"label":"Claude Help Center: How large is the context window on paid Claude plans?","url":"https://support.claude.com/en/articles/8606394-how-large-is-the-context-window-on-paid-claude-plans"},{"label":"Claude Docs: Models overview (1M tokens ≈ 555.000 woorden)","url":"https://platform.claude.com/docs/en/about-claude/models/overview"},{"label":"Anthropic: Effective context engineering for AI agents","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"},{"label":"Claude Code Docs: Explore the context window","url":"https://code.claude.com/docs/en/context-window"}],"zoekwoorden":["tokens","context rot","/compact","/context","samenvatten","geheugen"]},{"id":"1.6","niveau":1,"titel":"Losse vraag of vaste route","icoon":"refresh","minuten":2,"kort":"Elke week opnieuw vragen, of één keer goed regelen? Voor terugkerend werk loont een vaste route.","inEenZin":"Wie terugkerend werk elke keer in een losse chat vraagt, krijgt elke keer iets anders; leg de richtlijnen één keer vast.","uitleg":["Zo begint bijna iedereen: een nieuwe chat, een korte vraag, kijken wat eruit komt. Voor iets eenmaligs is dat prima. Komt de klus elke week terug, dan wringt het. Claude begint elke keer blanco, kiest elke keer een andere opmaak, en jij legt elke keer opnieuw uit.","Beter: leg één keer vast wat erin moet, hoe het eruitziet en wat goed is, met een voorbeeld. Dat kan in een project, een skill of een geplande taak (niveau 2). Of je laat Claude één keer een script schrijven: gewone code die het werk daarna elke keer zelf doet, zonder AI. Welke route wanneer past, lees je in 2.13."],"visualTitel":"Drie weken hetzelfde overzicht","visual":{"type":"chat","scenarios":[{"label":"Week na week","caption":"Links elke week een losse chat met dezelfde korte vraag: elke week een ander overzicht. Rechts dezelfde vraag in een project met richtlijnen en een sjabloon: elke week hetzelfde, en hij ziet zelf dat er iets ontbreekt.","panes":[{"title":"Nieuwe chat","events":[{"t":"status","text":"Week 40","icon":"calendar"},{"t":"user","text":"Maak een overzicht van de servicebezoeken.","files":[{"name":"export.csv","kind":"sheet"}]},{"t":"file","name":"overzicht.xlsx","kind":"sheet","note":"Per klant · 6 kolommen"},{"t":"status","text":"Week 41 · zelfde vraag","icon":"calendar"},{"t":"file","name":"servicebezoeken-wk41.xlsx","kind":"sheet","note":"Per datum · 4 kolommen, andere volgorde"},{"t":"status","text":"Week 42 · zelfde vraag","icon":"calendar"},{"t":"file","name":"Overzicht_v2.xlsx","kind":"sheet","note":"Per regio · regio Zuid ontbreekt, niemand ziet het"}],"label":"Losse chat, zonder richtlijnen","model":"Opus 5.5","verdict":{"tone":"warn","text":"Elke week anders, elke week verbeteren"}},{"title":"Weekoverzicht","events":[{"t":"status","text":"Week 40","icon":"calendar"},{"t":"user","text":"Maak een overzicht van de servicebezoeken.","files":[{"name":"export.csv","kind":"sheet"}]},{"t":"file","name":"weekoverzicht-wk40.xlsx","kind":"sheet","note":"Volgens sjabloon"},{"t":"status","text":"Week 41 · zelfde vraag","icon":"calendar"},{"t":"file","name":"weekoverzicht-wk41.xlsx","kind":"sheet","note":"Volgens sjabloon"},{"t":"status","text":"Week 42 · zelfde vraag","icon":"calendar"},{"t":"file","name":"weekoverzicht-wk42.xlsx","kind":"sheet","note":"Volgens sjabloon"},{"t":"note","tone":"warn","text":"Regio Zuid ontbreekt in de export van deze week."}],"label":"Project met richtlijnen","model":"Opus 5.5","chips":[{"text":"Richtlijnen","icon":"list"},{"text":"weekoverzicht.xlsx","icon":"sheet"},{"text":"Voorbeeld van goed","icon":"check"}],"verdict":{"tone":"ok","text":"Elke week hetzelfde, en hij denkt mee"}}]},{"label":"Eén keer laten bouwen","caption":"Je kunt Claude ook één keer een script laten schrijven: gewone code die daarna elke week het hele werk doet, zonder AI. Snel, voorspelbaar en zonder verbruik. Verandert de export, dan moet het script mee.","panes":[{"title":"weekoverzicht — Claude Code","events":[{"t":"user","text":"Schrijf een script dat elke maandag de nieuwste export ophaalt, er het weekoverzicht in Excel van maakt en het naar planning mailt. Daarna wil ik er geen AI meer voor nodig hebben."},{"t":"code","title":"weekoverzicht.py (ingekort)","text":"import pandas as pd\n\nexport = pd.read_csv(nieuwste_export())\noverzicht = export.pivot_table(\n    index=\"regio\", columns=\"monteur\",\n    values=\"uren\", aggfunc=\"sum\")\noverzicht.to_excel(\"weekoverzicht.xlsx\")\nmail_naar(\"planning\", \"weekoverzicht.xlsx\")","ms":1800},{"t":"tool","icon":"check","text":"Getest met de export van week 40","tone":"ok"},{"t":"note","tone":"info","text":"Op de werkplekken mogen geen scripts draaien. IT zet hem op een server die elke maandag om 07:00 start."}],"label":"**Eén keer:** Claude schrijft de code","model":"Opus 5.5","verdict":{"tone":"ok","text":"Eén keer AI, daarna gewone code"}},{"title":"Server · weekoverzicht.py","events":[{"t":"status","text":"Elke maandag 07:00, zonder Claude","icon":"clock","ms":2600},{"t":"tool","icon":"terminal","text":"Week 41: export ingelezen, overzicht gemaild","tone":"ok"},{"t":"tool","icon":"terminal","text":"Week 42: export ingelezen, overzicht gemaild","tone":"ok"},{"t":"tool","icon":"terminal","text":"Week 43: export ingelezen, overzicht gemaild","tone":"ok"},{"t":"tool","icon":"terminal","text":"Week 44: fout, kolom ‘regio’ heet nu ‘gebied’","tone":"bad"},{"t":"note","tone":"warn","text":"Verandert de export, dan stopt het script. Vraag Claude dan om het aan te passen, en het loopt weer."}],"label":"**Daarna elke week:** alleen de code","meter":{"sec":2,"usage":0,"extra":"AI-verbruik: 0"},"verdict":{"tone":"ok","text":"Snel en zonder AI; wel onderhoud bij wijzigingen"}}]}]},"tips":["**Eenmalig?** Gewoon vragen in een chat.","**Komt het terug?** Schrijf één keer op wat erin moet, hoe het eruitziet en wat goed is, met een voorbeeld.","**Altijd precies dezelfde stappen?** Laat Claude één keer een script schrijven. Daarna doet gewone code het werk, zonder AI. Scripts draaien via IT, niet op je werkplek.","**Weet je het niet?** Vraag het Claude: “Ik doe dit elke week. Wat is de beste manier om dit vast te leggen?”"],"metafoor":["Vraag je een nieuwe collega elke week mondeling “maak even dat overzicht”, dan krijg je elke week iets anders. Geef je hem één keer een werkinstructie met een voorbeeld, dan is het elke week hetzelfde.","En soms is het slimmer om hem één keer een machine te laten bouwen die het werk daarna zelf doet. Dan heb je hem voor dat klusje niet meer nodig."],"voorbeelden":[{"soort":"echt","titel":"Van losse vraag naar vaste tool","tekst":"De juristen van Anthropic beantwoordden marketingvragen eerst één voor één. Nu staat hun beoordelingskader in een skill en krijgen marketeers binnen 24 uur antwoord in plaats van na twee tot drie dagen.","bron":{"label":"Claude blog: How Anthropic uses Claude in Legal","url":"https://claude.com/blog/how-anthropic-uses-claude-legal"}},{"soort":"numafa","afdeling":"planning","titel":"Het weekoverzicht","erin":"Elke maandag de export van de servicebezoeken.","claude":"Eén keer: een project met richtlijnen, een sjabloon en een voorbeeld van een goed overzicht.","eruit":"Elke week hetzelfde overzicht in een paar minuten, met een waarschuwing als er gegevens ontbreken."},{"soort":"thuis","titel":"De boodschappenlijst","tekst":"Elke week opnieuw bedenken wat je nodig hebt, of een vaste basislijst die je alleen aanvult. Het tweede is sneller, en je vergeet minder."}],"probeer":{"prompt":"Ik doe deze klus regelmatig: [beschrijf de klus, bijvoorbeeld: elke maandag een overzicht van de servicebezoeken maken]. Help me hem vast te leggen. Stel me eerst vragen over wat erin moet, hoe het eruit moet zien en wat ‘goed’ is. Schrijf daarna richtlijnen van maximaal tien regels die ik in een project of skill kan zetten.","tip":"Plak de richtlijnen in een project (2.3) of laat Claude er een skill van maken (2.5)."},"valkuil":"Elke week dezelfde korte vraag in een nieuwe chat, en dan elke week de verschillen verbeteren. Dat kost meer tijd dan één keer de richtlijnen vastleggen.","quiz":[{"vraag":"Je maakt elke week hetzelfde overzicht met een korte vraag in een nieuwe chat. Wat is het risico?","opties":["Elke week een iets andere opmaak en inhoud","Claude weigert na drie keer","Geen: Claude weet vanzelf hoe je het vorige keer had"],"goed":0,"goedUitleg":"Precies. Zonder vaste richtlijnen kiest hij elke keer opnieuw.","foutUitleg":"Een nieuwe chat begint blanco. Zonder richtlijnen kiest hij elke keer een andere aanpak."},{"vraag":"Wat is een ‘vaste route’ voor terugkerend werk?","opties":["Richtlijnen, een voorbeeld en eventueel een sjabloon die je één keer vastlegt","Altijd hetzelfde model kiezen","De vraag in hoofdletters typen"],"goed":0,"goedUitleg":"Klopt. In een project, een skill of een geplande taak.","foutUitleg":"Een vaste route is: één keer vastleggen wat erin moet, hoe het eruitziet en wat goed is."}],"stand":"2026-10-09","bronnen":[{"label":"Claude Docs: Prompting best practices","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"},{"label":"Claude Help Center: What are projects?","url":"https://support.claude.com/en/articles/9517075-what-are-projects"},{"label":"Claude Help Center: Use skills in Claude","url":"https://support.claude.com/en/articles/12512180-use-skills-in-claude"},{"label":"Claude Help Center: Schedule recurring tasks","url":"https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork"},{"label":"Claude blog: How Anthropic uses Claude in Legal","url":"https://claude.com/blog/how-anthropic-uses-claude-legal"}],"zoekwoorden":["automatiseren","terugkerend","richtlijnen","vaste route","sjabloon","elke week","losse chat"]},{"id":"2.1","niveau":2,"titel":"Alle bouwstenen op een rij","icoon":"blocks","minuten":3,"kort":"Tien bouwstenen, één vraag: wanneer weet Claude het?","inEenZin":"Tien bouwstenen bepalen wat Claude weet en kan; het verschil zit in wanneer hij ze erbij pakt.","uitleg":["Sommige bouwstenen gelden altijd, zoals je voorkeuren. Andere alleen binnen een project, of alleen als de klus erom vraagt, zoals skills en connectors. Geplande taken lopen op een tijdstip, zonder jou. En artifacts blijven los liggen als opgeleverd werk.","Waarom dat ertoe doet: alles wat altijd geladen wordt, ligt op zijn bureau en neemt ruimte in. Zet daarom korte, algemene dingen in je voorkeuren, en uitgebreide werkwijzen in een skill die hij alleen pakt als het nodig is. Filter de tabel hieronder en klik op een rij voor uitleg."],"visualTitel":"Wanneer weet Claude het?","visual":{"type":"table","kolommen":["Bouwsteen","Wanneer geladen","Waarvoor","Metafoor"],"hint":"Klik op een rij voor uitleg, of filter op moment.","filters":[{"label":"Alles","tag":null},{"label":"Altijd","tag":"altijd","uitleg":"Deze liggen in elke chat op zijn bureau. Houd ze kort."},{"label":"Binnen een project","tag":"project","uitleg":"Alleen in chats binnen dat project. Handig voor alles wat bij één klant, machine of afdeling hoort."},{"label":"Als de klus erom vraagt","tag":"taak","uitleg":"Claude pakt deze er alleen bij als de taak erom vraagt. Ze nemen dus geen ruimte in als het niet nodig is."},{"label":"Op een tijdstip","tag":"tijd","uitleg":"Loopt vanzelf, ook als jij er niet bent."},{"label":"Los opgeleverd","tag":"los","uitleg":"Blijft bestaan buiten het gesprek, om te bewaren, delen en bij te werken."}],"rijen":[{"cellen":["Voorkeuren","Altijd, in elke chat","Stijl: “kort”, “Nederlands”","Inwerkgesprek"],"tags":["altijd"],"uitleg":"Settings > General > Instructions for Claude. Kort houden: dit ligt in elke chat op zijn bureau. Zie tegel 2.2."},{"cellen":["Organisatie-instructies","Altijd, voor iedereen in de organisatie","Huisregels van het bedrijf","Personeelshandboek"],"tags":["altijd"],"uitleg":"Alleen op Team en Enterprise, ingesteld door de Owner. Bij een conflict met jouw voorkeuren winnen deze."},{"cellen":["Geheugen","Altijd beschikbaar; Claude slaat losse onderwerpen op","Feiten over jou die Claude onthoudt","Notitieboekje"],"tags":["altijd"],"uitleg":"Je leest en wist de notities in Settings > Memory. Elk project heeft een eigen geheugen. Zie tegel 2.4."},{"cellen":["Projectinstructies","Altijd, binnen dat project","Rol, regels, wie-doet-wat","Binnenkant van de projectmap"],"tags":["project"],"uitleg":"Gelden voor elke chat in het project. Houd ze algemeen; het specifieke vraag je in de chat. Zie tegel 2.3."},{"cellen":["Projectkennis","Binnen het project; bij veel stof doorzocht","Naslag: handleidingen, lijsten","Inhoud van de projectmap"],"tags":["project"],"uitleg":"Is er veel, dan zoekt Claude alleen de relevante stukken op. Dat geeft tot 10× meer ruimte op betaalde abonnementen."},{"cellen":["Skills","Alleen als de taak erbij past","Werkwijze per taak, met sjabloon","Werkinstructies in de kast"],"tags":["taak"],"uitleg":"Aan de beschrijving van de skill ziet Claude wanneer hij hem nodig heeft. Zie tegel 2.5."},{"cellen":["Plugins","Zoals skills en connectors","Bundel van skills, connectors, commando's en agents","Gereedschapskist"],"tags":["taak"],"uitleg":"Eén installatie voor een rol of team. Zie tegel 3.4."},{"cellen":["Connectors","Als een taak de app nodig heeft","Toegang tot Outlook, SharePoint, Teams","Toegangspas"],"tags":["taak"],"uitleg":"Koppelingen met andere apps, gebouwd op MCP. Zie tegels 2.6 en 3.3."},{"cellen":["Artifacts","Blijven los bestaan, privé tot je deelt","Output die je bewaart, deelt of bijwerkt","Opgeleverd werk"],"tags":["los"],"uitleg":"Documenten, presentaties, ontwerpen en mini-apps naast het gesprek. Zie tegel 2.8."},{"cellen":["Geplande taken","Op een tijdstip, zonder jou, in de cloud","“Elke maandag de nabellijst”","Afspraak in zijn agenda"],"tags":["tijd"],"uitleg":"Draaien in de cloud, ook als je computer slaapt. Zie tegel 2.12."}]},"metafoor":["Het hele inwerktraject op één A4: het inwerkgesprek, het personeelshandboek, zijn notitieboekje, de projectmap, de werkinstructies in de kast, de gereedschapskist, de toegangspas, het opgeleverde werk en zijn agenda.","Een goede leidinggevende weet wat de nieuwe collega altijd moet weten, en wat hij pas hoeft te pakken als de klus erom vraagt."],"voorbeelden":[{"soort":"echt","titel":"De juristen van Anthropic","tekst":"Ze combineren bouwstenen: een skill met hun beoordelingskader, een koppeling (MCP) met een Drive-map vol eerdere analyses, en Slack als ingang. Marketingteksten zijn nu binnen 24 uur beoordeeld in plaats van na twee tot drie dagen.","bron":{"label":"Claude blog: How Anthropic uses Claude in Legal","url":"https://claude.com/blog/how-anthropic-uses-claude-legal"}},{"soort":"numafa","afdeling":"service","titel":"De servicecollega in vijf stenen","erin":"Voorkeur (kort, Nederlands), project “Service” met handleidingen, skill “servicerapport”, de Outlook-connector en een geplande taak op maandag.","claude":"Pakt per klus de juiste steen erbij.","eruit":"Rapporten in vaste vorm, antwoorden met artikelnummer, en maandag om 7:30 een lijst met open tickets."}],"probeer":{"prompt":"Ik werk op de afdeling [afdeling] bij een machinebouwer. Welke dingen zou ik in mijn voorkeuren zetten, welke in een project, en voor welke terugkerende taak loont een skill? Geef per bouwsteen twee concrete voorbeelden voor mijn werk.","tip":"Een goed begin voor niveau 2: je krijgt meteen een plan om Claude voor jouw werk in te richten."},"valkuil":"Alles in je voorkeuren proppen. Die liggen in elke chat op zijn bureau, ook als ze niet relevant zijn. Een lange werkwijze voor één taak hoort in een skill.","quiz":[{"vraag":"Waar zet je een uitgebreide werkwijze voor het schrijven van servicerapporten?","opties":["In je voorkeuren","In een skill","In een geplande taak"],"goed":1,"goedUitleg":"Een skill pakt hij alleen als de klus erom vraagt.","foutUitleg":"Een uitgebreide werkwijze voor één taak hoort in een skill; die pakt hij alleen als het nodig is."},{"vraag":"Welke bouwsteen loopt zonder dat jij erbij bent?","opties":["Geplande taken","Projectinstructies","Artifacts"],"goed":0,"goedUitleg":"Klopt, op een vast moment in de cloud.","foutUitleg":"Dat zijn de geplande taken: op een vast moment, in de cloud."}],"stand":"2026-10-08","bronnen":[{"label":"Claude Help Center: Understanding Claude's personalization features","url":"https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features"},{"label":"Claude Help Center: Set organization instructions","url":"https://support.claude.com/en/articles/14546867-set-organization-instructions"},{"label":"Claude Help Center: Chat search and memory","url":"https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context"},{"label":"Claude Help Center: RAG for projects","url":"https://support.claude.com/en/articles/11473015-retrieval-augmented-generation-rag-for-projects"},{"label":"Claude Help Center: Use skills in Claude","url":"https://support.claude.com/en/articles/12512180-use-skills-in-claude"},{"label":"Claude Docs: Plugins","url":"https://claude.com/docs/plugins/overview"},{"label":"Claude Help Center: What are artifacts?","url":"https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them"},{"label":"Claude Help Center: Schedule recurring tasks","url":"https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork"}],"zoekwoorden":["bouwstenen","tabel","voorkeuren","geheugen","skills","plugins","connectors","artifacts","geplande taken"],"breed":true},{"id":"2.2","niveau":2,"titel":"Voorkeuren en stijl","icoon":"chips","minuten":2,"kort":"Eén keer zeggen hoe je het wilt. Een vaste stijl leg je vast in een .md of skill.","inEenZin":"Vertel één keer wie je bent en hoe je het wilt hebben; een uitgewerkte schrijfstijl leg je vast in een .md-bestand of een skill.","uitleg":["In **Settings > General** staat *Instructions for Claude*. Wat je daar zet, geldt in elk gesprek: je rol, je afdeling, en hoe je antwoorden wilt (kort, Nederlands, met opsommingen). Op Team en Enterprise kan de beheerder ook **organisatie-instructies** zetten; bij een conflict winnen die.","Het oude menu Stijlen lijkt verdwenen. Een vaste schrijfstijl met voorbeelden leg je daarom vast in een **`.md`-bestand** in een project, of in een **skill** die Claude overal gebruikt. Vraag Claude gewoon: “maak een skill van onze schrijfstijl”."],"visualTitel":"Dezelfde vraag, jouw stijl","visual":{"type":"chat","scenarios":[{"label":"Wat is wat?","caption":"Eerst de plekken waar je vastlegt hoe Claude moet werken. Klik ze aan: je ziet wat het is en hoe het eruitziet. Daarna zie je het verschil in een gesprek.","explain":{"title":"Waar leg je je stijl vast?","items":[{"name":"Voorkeuren","code":"Ik werk bij Numafa, afdeling service.\nAntwoord kort en in het Nederlands.\nEerst het antwoord, dan de uitleg.","sub":"Settings > General","text":"Een paar regels over jou en hoe je antwoorden wilt. Ze gelden in elk gesprek, zonder dat je ze herhaalt.","use":"korte, algemene wensen."},{"name":".md-bestand","code":"# Schrijfstijl Numafa\n- Je-vorm, nuchter en concreet\n- Korte zinnen, geen superlatieven\n- Eerst de kern, dan de uitleg\n\n## Voorbeeld van goed\nVanaf november kun je je machines laten\nonderhouden met een vast abonnement.","sub":"tekst met simpele opmaak","text":"Markdown (.md) is gewone tekst met een paar tekens voor opmaak: # voor een kop, - voor een opsomming. Je maakt het in Kladblok, of je laat Claude het maken. Zet het in een project, dan gebruikt elke chat daarin het.","use":"een schrijfstijl of afspraken voor één project."},{"name":"Skill","code":"numafa-schrijfstijl/\n  SKILL.md\n    etiket en werkinstructie\n  voorbeelden.md\n    drie goede teksten","sub":"een mapje dat Claude overal pakt","text":"Een map met een SKILL.md (etiket en werkinstructie) en eventueel voorbeelden. Claude pakt hem zelf als de klus erom vraagt, in elk gesprek. Meer in 2.5.","use":"een stijl die je overal wilt gebruiken, ook in Claude Code en de Office-add-ins."},{"name":"Organisatie","sub":"beheerder, op Team en Enterprise","text":"Instructies die voor iedereen in de organisatie gelden. Botsen ze met jouw vraag, dan gaan die van de organisatie voor.","use":"afspraken die voor iedereen gelden."}],"foot":"Vuistregel: kort en algemeen in je voorkeuren; uitgebreid en met voorbeelden in een .md-bestand of een skill."}},{"label":"Voorkeuren","caption":"Zelfde vraag, met en zonder voorkeuren. In het rechtervenster staan voorkeuren uit Settings > General. Je hoeft ze niet te herhalen: ze gelden in elk gesprek.","panes":[{"title":"Claude","events":[{"t":"user","text":"Wat is het verschil tussen een schrobzuigmachine en een veegmachine?"},{"t":"answer","text":"Goede vraag! Beide machines worden gebruikt voor vloerreiniging, maar ze verschillen op een aantal belangrijke punten.\n**1. Werking.** Een schrobzuigmachine reinigt nat…\n**2. Toepassing.** Een veegmachine is vooral geschikt voor…\n**3. Kosten en onderhoud.** …"}],"label":"Zonder voorkeuren","model":"Opus 5.5","verdict":{"tone":"warn","text":"Lang en algemeen"}},{"title":"Claude","events":[{"t":"user","text":"Wat is het verschil tussen een schrobzuigmachine en een veegmachine?"},{"t":"side-mark","index":0,"tone":"accent"},{"t":"side-mark","index":1,"tone":"accent"},{"t":"side-mark","index":2,"tone":"accent"},{"t":"answer","text":"**Schrobzuiger:** nat reinigen en meteen opzuigen.\n**Veegmachine:** droog vuil en zwerfafval opvegen.\nVoor service: de schrobzuiger vraagt meer onderhoud (borstels, rubbers, tanks)."}],"label":"Met voorkeuren","model":"Opus 5.5","side":{"title":"Instructions for Claude","items":[{"text":"Ik werk bij Numafa, afdeling service"},{"text":"Kort en in het Nederlands"},{"text":"Eerst het antwoord, dan de uitleg"},{"text":"Opsommingen, geen lappen tekst"}]},"verdict":{"tone":"ok","text":"Kort en op maat, vanzelf"}}]},{"label":"Schrijfstijl als skill","caption":"Een schrijfstijl met voorbeelden past niet in een paar regels voorkeuren. Leg hem vast in een skill (of in een .md-bestand in een project). Je ziet wanneer Claude hem gebruikt.","panes":[{"title":"Claude","events":[{"t":"user","text":"Schrijf een stukje voor de klantnieuwsbrief over ons nieuwe onderhoudsabonnement."},{"t":"answer","text":"Wij zijn verheugd u ons gloednieuwe, revolutionaire onderhoudsabonnement te presenteren!\nOntdek de ongekende voordelen…"}],"label":"Zonder stijlskill","model":"Opus 5.5","verdict":{"tone":"warn","text":"Klinkt als elke andere nieuwsbrief"}},{"title":"Claude","events":[{"t":"user","text":"Schrijf een stukje voor de klantnieuwsbrief over ons nieuwe onderhoudsabonnement."},{"t":"status","text":"Using numafa-schrijfstijl","icon":"book"},{"t":"answer","text":"Vanaf november kun je je machines laten onderhouden met een vast abonnement.\nEén bedrag per maand, twee keer per jaar een volledige beurt, en bij een storing binnen twee werkdagen een monteur.\nInteresse? Mail je accountmanager."}],"label":"Met stijlskill","model":"Opus 5.5","verdict":{"tone":"ok","text":"Klinkt als Numafa"}}]}]},"metafoor":["Het inwerkgesprek op dag één: “Ik ben Sanne van inkoop. Hou het kort en zakelijk, en altijd in het Nederlands.” Dat hoef je daarna niet elke ochtend te herhalen.","De uitgebreide schrijfstijl van de afdeling, met voorbeelden, geef je hem als werkinstructie mee: een .md-bestand in de projectmap of een skill in de kast."],"voorbeelden":[{"soort":"echt","titel":"Formeel wint","tekst":"Uit de officiële handleiding: zet de organisatie “Always respond in formal English” en jij “casual”, dan antwoordt Claude formeel. De huisregels van het bedrijf gaan voor.","bron":{"label":"Claude Help Center: Set organization instructions","url":"https://support.claude.com/en/articles/14546867-set-organization-instructions"}},{"soort":"echt","titel":"Huisstijl in een skill","tekst":"Claude Academy laat zien hoe je merkrichtlijnen in een skill verpakt, zodat Claude ze overal toepast waar het past.","bron":{"label":"Claude Academy: Package your brand guidelines in a skill","url":"https://academy.claude.com/use-cases/package-your-brand-guidelines-in-a-skill"}},{"soort":"numafa","afdeling":"service","titel":"De servicetoon als skill","erin":"Vijf goede klantmails van de serviceafdeling en de vraag: “maak hier een skill van”.","claude":"Maakt er met de ingebouwde skill-creator een SKILL.md van: toon, vaste opbouw, voorbeelden.","eruit":"Elke servicemail klinkt hetzelfde, wie hem ook laat schrijven."},{"soort":"thuis","titel":"Koken voor vier","tekst":"“Ik kook vegetarisch voor vier personen” in je voorkeuren, en elk recept komt voortaan meteen goed omgerekend."}],"probeer":{"prompt":"Hier zijn drie teksten die ik goed vind: [plak ze]. Beschrijf mijn schrijfstijl in een kort stijlbestand (schrijfstijl.md) met: toon, zinslengte, woorden die ":"Projects","icoon":"folder","minuten":2,"kort":"Projectmap met vaste instructies en documenten.","inEenZin":"Een project is een map met vaste instructies en documenten, zodat elke chat daarin al gebriefd begint.","uitleg":["In een project zet je **instructies** (rol, regels) en **projectkennis** (handleidingen, lijsten, voorbeelden). Elke chat in dat project gebruikt die. Chats delen niet vanzelf hun inhoud. Op betaalde abonnementen kan Claude wel eerdere chats in het project doorzoeken als je ernaar vraagt. Wat altijd moet gelden, zet je in de kennis.","Is er veel kennis, dan leest Claude niet alles maar zoekt hij de relevante stukken op. Dat geeft tot tien keer meer ruimte (op betaalde abonnementen). Geef bestanden daarom duidelijke namen. Elk project heeft ook een eigen geheugen. Op Free kun je vijf projects maken."],"visualTitel":"De projectmap","visual":{"type":"chat","scenarios":[{"label":"Wat zit erin?","caption":"Eerst wat er in een project zit. Klik de onderdelen aan. Daarna zie je het verschil tussen een losse chat en een chat in een project.","explain":{"title":"Een project is een map met vier onderdelen","items":[{"name":"Instructies","code":"Je helpt monteurs van Numafa.\nAntwoord kort en concreet.\nNoem altijd de bron uit de projectkennis.","sub":"de vaste briefing","text":"Rol en regels die gelden voor elke chat in het project."},{"name":"Projectkennis","sub":"de documenten","text":"Handleidingen, lijsten en voorbeelden. Bij veel kennis zoekt Claude de stukken op die ertoe doen. Op betaalde abonnementen past er zo tot tien keer meer in.","example":"servicevoorwaarden.pdf, storingscodes.xlsx, schrijfstijl.md"},{"name":"Chats","sub":"de gesprekken","text":"Elke chat in het project begint al gebriefd. Chats delen niet vanzelf hun inhoud. Op betaalde abonnementen kan Claude wel eerdere chats in het project doorzoeken als je ernaar vraagt."},{"name":"Geheugen","sub":"per project","text":"Elk project heeft een eigen geheugen, los van je andere gesprekken. n gesprekken door, en jij kunt meelezen, aanpassen en schrappen.","uitleg":["Tijdens het chatten bewaart Claude losse onderwerpen: je rol, je projecten, je voorkeuren. In **Settings > Memory** lees je ze terug en pas je ze aan of wis je ze. In de chat werkt het ook: “onthoud dat …” of “vergeet …”.","Een **incognito**-chat (spookje) wordt niet onthouden, en per chat kun je memory uitzetten. Elk project heeft een eigen geheugen. Gevoelige onderwerpen zoals gezondheid of politiek slaat Claude standaard niet op. Let op: een gesprek verwijderen wist niet de notities die eruit kwamen. Op Team en Enterprise zet de beheerder memory aan; daarna kies je zelf."],"visualTitel":"Het notitieboekje","visual":{"type":"chat","scenarios":[{"label":"Onthouden","caption":"Vertel iets wat blijvend is, en Claude zet het in zijn notitieboekje. Rechts lees je mee, zoals in Settings > Memory.","panes":[{"title":"Nieuwe chat","events":[{"t":"user","text":"Onthoud: ik werk bij Numafa op de planning, en ik wil overzichten altijd per regio."},{"t":"memory","text":"Geheugen bijgewerkt"},{"t":"side-add","text":"Werkt bij Numafa, afdeling planning","tone":"accent"},{"t":"side-add","text":"Overzichten altijd per regio","tone":"accent"},{"t":"answer","text":"Genoteerd. Daar houd ik voortaan rekening mee."}],"model":"Opus 5.5","side":{"title":"Memory","items":[{"text":"Werkt vaak met Excel-overzichten"}]},"verdict":{"tone":"ok","text":"Opgeschreven"}}]},{"label":"Een week later","caption":"Nieuwe chat, en toch hoef je het niet te herhalen. Claude gebruikt wat in zijn notities staat.","panes":[{"title":"Nieuwe chat","events":[{"t":"user","text":"Maak een overzicht van de servicebezoeken van deze maand.","files":[{"name":"bezoeken-oktober.xlsx","kind":"sheet"}]},{"t":"side-mark","index":1,"tone":"accent"},{"t":"side-mark","index":2,"tone":"accent"},{"t":"memory","text":"Uit memory: planning, per regio"},{"t":"file","name":"bezoeken-oktober-per-regio.xlsx","kind":"sheet","note":"Per regio, zoals je gewe
