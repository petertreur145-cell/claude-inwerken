<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">

<title>Claude inwerken</title>
<style>
/* Claude inwerken — presentatiestijl.
   Het podium (#deck) is 1600 × 900 en wordt in zijn geheel geschaald (app.js), dus alle maten hieronder zijn
   pixels op dat podium. Op een beamer van 1920 × 1080 is alles 1,2 keer zo groot, op een laptop van 1366 × 768 0,85 keer. */

:root {
  /* Huiskleuren: --accent is de hoofdkleur, --lvl-1/2/3 de kleuren van de drie blokken */
  --accent: #0071E3;
  --on-accent: #FFFFFF;
  --lvl-1: #0071E3;           /* De basis */
  --lvl-2: #1E8E4E;           /* Verlengstukken */
  --lvl-3: #E8590C;           /* Toepassingen inkoop */

  --bg: #F5F5F7;
  --surface: #FFFFFF;
  --fill: #E8E8ED;
  --fill-2: #F0F0F3;
  --text: #1D1D1F;
  --text-2: #6E6E73;
  --text-3: #86868B;
  --separator: #D2D2D7;
  --ok: #1E7A3C;
  --ok-fill: #E4F4E8;
  --warn: #B64400;
  --warn-fill: #FFF0E3;
  --bad: #C9001A;
  --bad-fill: #FDE7EA;
  --accent-fill: #E6F0FB;
  --shadow: 0 2px 6px rgba(0, 0, 0, 0.04), 0 12px 32px rgba(0, 0, 0, 0.07);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Cascadia Code", Consolas, Menlo, monospace;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  color-scheme: light;
}
.c-1 { --c: var(--lvl-1); --c-fill: #E6F0FB; }
.c-2 { --c: var(--lvl-2); --c-fill: #E4F4E8; }
.c-3 { --c: var(--lvl-3); --c-fill: #FFF0E3; }

/* ---------- Basis ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
body {
  color: var(--text); font: 400 30px/1.35 var(--font); letter-spacing: -0.012em;
  -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default;
}
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; }
code { font-family: var(--font-mono); font-size: 0.9em; background: var(--fill-2); padding: 0.05em 0.3em; border-radius: 8px; letter-spacing: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--accent); outline-offset: 4px; border-radius: 10px; }
.noscript { padding: 80px; font-size: 32px; }

#deck { position: fixed; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; display: flex; flex-direction: column; }
#slide { flex: 1; min-height: 0; padding: 60px 80px 0; position: relative; }

/* ---------- Voortgang onderin ---------- */
#bar { height: 64px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 32px 0 66px; font-size: 19px; color: var(--text-3); white-space: pre; }
.bar-spacer { flex: 1; }
.bar-btn { width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: var(--text-3); display: grid; place-items: center; cursor: pointer; padding: 0; }
.bar-btn:hover { background: var(--fill); color: var(--text); }
.bar-btn svg { width: 24px; height: 24px; }
.bar-btn[data-act="home"] { margin-left: -14px; }
#dots { display: flex; gap: 8px; margin-left: 10px; }
#dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--separator); }
#dots i.on { background: var(--text-2); }

/* ---------- Stappen ---------- */
[data-s] { transition: opacity 0.35s var(--ease), transform 0.35s var(--ease), background-color 0.35s, border-color 0.35s, box-shadow 0.35s, color 0.35s; }
[data-s]:not(.is-on) { opacity: 0; transform: translateY(14px); }
.no-anim, .no-anim * { transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }

/* ---------- Startscherm ---------- */
.home { height: 100%; display: flex; flex-direction: column; }
.home-head { display: flex; align-items: center; gap: 28px; }
.logo { width: 84px; height: 84px; flex: none; border-radius: 22px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 700 44px/1 var(--font-display); }
.eyebrow { font-size: 24px; font-weight: 600; color: var(--text-2); letter-spacing: -0.01em; }
.home-head h1 { font-size: 84px; line-height: 1.02; font-weight: 700; letter-spacing: -0.035em; }
.home-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px; margin: 48px 0 22px; }
.blk {
  display: flex; flex-direction: column; padding: 36px 38px; border-radius: 30px; background: var(--surface); color: var(--text);
  box-shadow: var(--shadow); text-decoration: none; cursor: pointer; border-top: 10px solid var(--c);
  transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
.blk:hover { transform: translateY(-4px); }
.blk.is-hl { box-shadow: 0 0 0 4px var(--c), var(--shadow); }
.blk-num { width: 64px; height: 64px; border-radius: 50%; background: var(--c); color: #FFFFFF; display: grid; place-items: center; font: 700 34px/1 var(--font-display); }
.blk-num svg { width: 36px; height: 36px; stroke-width: 4; }
.blk h2 { margin-top: 22px; font-size: 46px; line-height: 1.08; font-weight: 700; letter-spacing: -0.03em; }
.blk ol { list-style: none; padding: 0; margin-top: 20px; display: flex; flex-direction: column; gap: 7px; font-size: 24px; line-height: 1.25; color: var(--text-2); }
.blk li.is-todo { color: var(--text-3); opacity: 0.6; }
.blk.is-done { opacity: 0.7; }
.blk.is-todo { cursor: default; }
.blk.is-todo:hover { transform: none; }
.home-hint { font-size: 22px; color: var(--text-3); text-align: center; padding-bottom: 6px; }
.home-hint span { margin: 0 10px; }

/* ---------- Tegel (slide) ---------- */
.tile { height: 100%; display: flex; flex-direction: column; }
.tile-mark { display: block; width: 72px; height: 8px; border-radius: 4px; background: var(--c); }
.tile-head h1 { margin-top: 22px; font-size: 76px; line-height: 1.04; font-weight: 700; letter-spacing: -0.035em; }
.zin { margin-top: 14px; max-width: 1320px; font-size: 36px; line-height: 1.28; color: var(--text-2); letter-spacing: -0.02em; text-wrap: balance; }
.tile-main { flex: 1; min-height: 0; display: flex; gap: 48px; margin-top: 40px; padding-bottom: 26px; }
.tile-visual { flex: 1; min-width: 0; display: flex; }
.punten { flex: 0 0 400px; list-style: none; padding: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; font-size: 30px; line-height: 1.25; }
.punten li { padding-left: 26px; border-left: 5px solid var(--c); }

/* ---------- Visual: chat (vaag tegenover gebriefd) ---------- */
.v-chat { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
.cw-pane { display: flex; flex-direction: column; min-height: 0; }
.cw-label { font-size: 26px; font-weight: 600; color: var(--text-2); text-align: center; margin-bottom: 12px; }
.cw { flex: 1; display: flex; flex-direction: column; border-radius: 24px; background: var(--surface); box-shadow: 0 0 0 1px var(--separator), var(--shadow); overflow: hidden; }
.cw-bar { height: 44px; flex: none; display: flex; align-items: center; padding: 0 18px; background: var(--fill-2); border-bottom: 1px solid var(--separator); }
.cw-lights { display: flex; gap: 8px; }
.cw-lights i { width: 13px; height: 13px; border-radius: 50%; background: #FF5F57; }
.cw-lights i:nth-child(2) { background: #FEBC2E; }
.cw-lights i:nth-child(3) { background: #28C840; }
.cw-msgs { flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 28px 30px; font-size: 30px; line-height: 1.35; }
.cw-user { align-self: flex-end; max-width: 92%; padding: 14px 24px; border-radius: 26px 26px 8px 26px; background: var(--fill); }
.cw-user.is-brief { padding: 16px 26px; }
.brief div { display: flex; gap: 16px; }
.brief dt { flex: 0 0 150px; font-weight: 700; color: var(--c); }
.cw-answer { display: flex; flex-direction: column; gap: 4px; }
.cw-verdict { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 8px 20px 8px 14px; border-radius: 999px; font-size: 26px; font-weight: 600; }
.cw-verdict svg { width: 30px; height: 30px; stroke-width: 3.4; }
.cw-verdict.t-bad { background: var(--bad-fill); color: var(--bad); }
.cw-verdict.t-ok { background: var(--ok-fill); color: var(--ok); }

/* ---------- Visual: toepassing (vier vakjes + balk) ---------- */
.v-app { flex: 1; display: flex; flex-direction: column; gap: 26px; }
.app-row { flex: 1; min-height: 0; display: flex; }
.app-sep { flex: 0 0 44px; display: grid; place-items: center; color: var(--separator); }
.app-sep svg { width: 30px; height: 30px; }
.app-box {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; padding: 26px 26px; border-radius: 26px;
  background: var(--surface); box-shadow: var(--shadow); border: 2px solid transparent;
}
.app-box:not(.is-on) { opacity: 1; transform: none; background: transparent; box-shadow: none; border: 2px dashed var(--separator); }
.app-box.is-cur { box-shadow: 0 0 0 4px var(--c), var(--shadow); }
.app-box header { display: flex; align-items: center; gap: 12px; font: 700 27px/1.1 var(--font-display); color: var(--c); letter-spacing: -0.01em; }
.app-box:not(.is-on) header { color: var(--text-3); }
.app-num { width: 38px; height: 38px; border-radius: 50%; background: var(--c); color: #FFFFFF; display: grid; place-items: center; font-size: 21px; }
.app-box:not(.is-on) .app-num { background: var(--fill); color: var(--text-3); }
.app-body { flex: 1; display: flex; flex-direction: column; gap: 16px; margin-top: 22px; font-size: 29px; line-height: 1.28; transition: opacity 0.35s var(--ease), transform 0.35s var(--ease); }
.app-box:not(.is-on) .app-body { opacity: 0; transform: translateY(14px); }
.app-icon { color: var(--c); }
.app-icon svg { width: 52px; height: 52px; }
.chips { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.chips li { padding: 5px 15px; border-radius: 999px; background: var(--fill-2); font-size: 23px; font-weight: 600; }
.chips.warn li { background: var(--warn-fill); color: var(--warn); }
.chips.files { flex-direction: column; gap: 14px; }
.chips.files li { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--c-fill); font-size: 26px; line-height: 1.2; }
.chips.files svg { width: 36px; height: 36px; flex: none; color: var(--c); }
.app-bar { flex: none; display: flex; align-items: center; gap: 22px; padding: 18px 26px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); font-size: 28px; }
.app-bar b { display: inline-block; margin-right: 16px; padding: 4px 16px; border-radius: 999px; font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; vertical-align: 3px; }
.app-now b { background: var(--fill); color: var(--text-2); }
.app-next b { background: var(--c); color: #FFFFFF; }
.app-now { color: var(--text-2); }
.app-to { color: var(--text-3); display: grid; }
.app-to svg { width: 34px; height: 34px; }

</style>
</head>

</div>

<script>
/* Claude inwerken — visuals per tegel.
   Elke visual is een stuk HTML. Elementen met data-s="k" verschijnen bij stap k (1, 2, 3 of 4);
   de app zet daarvoor de klassen is-on (stap bereikt) en is-cur (huidige stap). Niets speelt vanzelf af.
   Soorten (visual.type in tegels.json):
   - "chat":       twee Claude-vensters naast elkaar, berichten per stap (alleen bij Prompting)
   - "toepassing": vast format van de inkooptegels: probleem, bestanden, Claude, waarom + balk nu → straks */
(function () {
  "use strict";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  // opmaak in teksten: **vet**, *schuin*, `code`
  function md(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>");
  }
  window.esc = esc;
  window.mdInline = md;
  var icon = function (n) { return window.iconSVG(n); };
  var FILEICON = { sheet: "sheet", pdf: "doc", doc: "doc", mail: "mail", md: "doc" };
  function s(k) { return k ? ' data-s="' + k + '"' : ""; }

  /* ---------- Chat: vaag tegenover gebriefd ---------- */
  function bericht(b) {
    if (b.van === "jij") {
      var body = b.briefing
        ? '<dl class="brief">' + b.briefing.map(function (r) { return '<div><dt>' + esc(r[0]) + '</dt><dd>' + md(r[1]) + '</dd></div>'; }).join("") + '</dl>'
        : md(b.tekst);
      return '<div class="cw-user' + (b.briefing ? " is-brief" : "") + '"' + s(b.stap) + '>' + body + '</div>';
    }
    if (b.van === "claude") {
      var lines = b.regels || [b.tekst];
      return '<div class="cw-answer"' + s(b.stap) + '>' + lines.map(function (l) { return '<p>' + md(l) + '</p>'; }).join("") + '</div>';
    }
    if (b.van === "oordeel") {
      var t = b.toon || "ok";
      return '<div class="cw-verdict t-' + esc(t) + '"' + s(b.stap) + '>' + icon(t === "ok" ? "check" : "cross") + '<span>' + md(b.tekst) + '</span></div>';
    }
    return "";
  }
  function chat(v) {
    return '<div class="v-chat">' + v.vensters.map(function (w) {
      return '<div class="cw-pane"><div class="cw-label">' + md(w.label) + '</div>' +
        '<div class="cw"><div class="cw-bar"><span class="cw-lights" aria-hidden="true"><i></i><i></i><i></i></span></div>' +
        '<div class="cw-msgs">' + w.berichten.map(bericht).join("") + '</div></div></div>';
    }).join("") + '</div>';
  }

  /* ---------- Toepassing: vier vakjes + balk ---------- */
  function vak(k, kop, ic, inhoud) {
    return '<section class="app-box"' + s(k) + '><header><span class="app-num" aria-hidden="true">' + k + '</span>' + esc(kop) + '</header>' +
      '<div class="app-body">' + (ic ? '<span class="app-icon">' + icon(ic) + '</span>' : '') + inhoud + '</div></section>';
  }
  function chips(list, cls) {
    return '<ul class="chips ' + (cls || "") + '">' + list.map(function (c) {
      return typeof c === "string" ? '<li>' + md(c) + '</li>' : '<li>' + icon(FILEICON[c.soort] || "doc") + '<span>' + md(c.naam) + '</span></li>';
    }).join("") + '</ul>';
  }
  function toepassing(v) {
    var arrow = '<span class="app-sep" aria-hidden="true">' + icon("arrow") + '</span>';
    return '<div class="v-app"><div class="app-row">' +
      vak(1, "Probleem", v.probleem.icoon, '<p>' + md(v.probleem.tekst) + '</p>') + arrow +
      vak(2, "Bestanden", null, chips(v.bestanden, "files")) + arrow +
      vak(3, "Claude", v.claude.icoon, '<p>' + md(v.claude.tekst) + '</p>' + (v.claude.chips ? chips(v.claude.chips, "warn") : "")) + arrow +
      vak(4, "Waarom", v.waarom.icoon, '<p>' + md(v.waarom.tekst) + '</p>') +
      '</div><div class="app-bar"' + s(4) + '>' +
        '<span class="app-now"><b>Nu</b>' + md(v.nu) + '</span>' +
        '<span class="app-to" aria-hidden="true">' + icon("arrow") + '</span>' +
        '<span class="app-next"><b>Straks</b>' + md(v.straks) + '</span>' +
      '</div></div>';
  }

  window.VISUALS = { chat: chat, toepassing: toepassing };
})();

</script>
<script>
/* Claude inwerken — presentatie.
   Volgorde: overzicht → tegels van blok 1 (→ quiz) → overzicht → blok 2 → … Elke positie is één scherm (slide).
   Volgende: pijl rechts, spatie, PageDown, klik of rechtsklik. Eerst de stappen van de visual, dan de volgende tegel.
   Vorige: pijl links of PageUp. Esc: overzicht. F: volledig scherm. Niets speelt vanzelf af: geen timers.
   Het podium is 1600 × 900 en schaalt mee met het venster, zodat de opmaak op elk scherm gelijk blijft. */
(function () {
  "use strict";
  var W = 1600, H = 900;
  var data = JSON.parse(document.getElementById("tegels").textContent);
  var md = window.mdInline, esc = window.esc;
  var deck = document.getElementById("deck"), slide = document.getElementById("slide");
  var whereEl = document.getElementById("where"), dotsEl = document.getElementById("dots");
  var SVG = function (p) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>'; };
  var BTN = {
    home: SVG('<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>'),
    prev: SVG('<path d="m15 5-7 7 7 7"/>'),
    next: SVG('<path d="m9 5 7 7-7 7"/>'),
    full: SVG('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'),
    exit: SVG('<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>')
  };

  /* ---------- Volgorde ---------- */
  var blokken = data.blokken;
  var klaar = function (t) { return !!t.visual; }; // een tegel zonder visual staat alleen nog op de agenda
  var seq = [];
  blokken.forEach(function (b, i) {
    var tegels = data.tegels.filter(function (t) { return t.blok === b.id && klaar(t); });
    var quiz = (data.quizzen || []).filter(function (q) { return q.blok === b.id; })[0];
    if (!tegels.length && !quiz) return;
    seq.push({ kind: "home", hl: i });
    tegels.forEach(function (t, k) { seq.push({ kind: "tile", tile: t, blok: b, nr: k + 1, van: tegels.length }); });
    if (quiz) seq.push({ kind: "quiz", quiz: quiz, blok: b });
  });
  seq.push({ kind: "home", hl: blokken.length }); // alles gehad

  var pos = 0, step = 0, steps = 0;

  /* ---------- Schermen ---------- */
  function homeHTML(hl) {
    return '<div class="home">' +
      '<header class="home-head"><span class="logo" aria-hidden="true">N</span><div><p class="eyebrow">' + esc(data.app.ondertitel) + '</p><h1>' + esc(data.app.titel) + '</h1></div></header>' +
      '<nav class="home-grid" aria-label="Blokken">' + blokken.map(function (b, i) {
        var tegels = data.tegels.filter(function (t) { return t.blok === b.id; });
        var open = tegels.some(klaar);
        var cls = "blk c-" + esc(b.kleur) + (i === hl ? " is-hl" : "") + (i < hl ? " is-done" : "") + (open ? "" : " is-todo");
        return '<a class="' + cls + '" href="#/' + esc((tegels.filter(klaar)[0] || {}).id || "") + '" data-blok="' + b.id + '"' + (open ? "" : ' aria-disabled="true"') + '>' +
          '<span class="blk-num">' + (i < hl ? window.iconSVG("check") : b.id) + '</span>' +
          '<h2>' + esc(b.naam) + '</h2>' +
          '<ol>' + tegels.map(function (t) { return '<li' + (klaar(t) ? "" : ' class="is-todo"') + '>' + esc(t.titel) + '</li>'; }).join("") + '</ol>' +
        '</a>';
      }).join("") + '</nav>' +
      '<p class="home-hint">Klik op een blok <span>·</span> → volgende <span>·</span> F volledig scherm</p>' +
    '</div>';
  }
  function tileHTML(p) {
    var t = p.tile, v = t.visual, render = window.VISUALS[v.type];
    var punten = t.punten && t.punten.length ? '<ul class="punten">' + t.punten.map(function (x) { return '<li>' + md(x) + '</li>'; }).join("") + '</ul>' : "";
    return '<article class="tile c-' + esc(p.blok.kleur) + (punten ? " has-punten" : "") + '">' +
      '<header class="tile-head"><span class="tile-mark" aria-hidden="true"></span><h1>' + md(t.titel) + '</h1>' + (t.zin ? '<p class="zin">' + md(t.zin) + '</p>' : '') + '</header>' +
      '<div class="tile-main"><div class="tile-visual v-' + esc(v.type) + '-wrap">' + render(v) + '</div>' + punten + '</div>' +
    '</article>';
  }

  function render(atEnd) {
    var p = seq[pos];
    slide.innerHTML = p.kind === "home" ? homeHTML(p.hl) : tileHTML(p);
    slide.classList.add("no-anim");
    steps = 0;
    Array.prototype.forEach.call(slide.querySelectorAll("[data-s]"), function (el) { steps = Math.max(steps, +el.getAttribute("data-s")); });
    step = atEnd ? steps : 0;
    applyStep();
    slide.getBoundingClientRect(); // eerste beeld zonder overgang
    slide.classList.remove("no-anim");
    if (location.hash !== hashOf(p)) location.hash = hashOf(p);
    document.title = (p.kind === "home" ? "" : p.tile.titel.replace(/[*`]/g, "") + " · ") + data.app.titel;
  }
  function applyStep() {
    Array.prototype.forEach.call(slide.querySelectorAll("[data-s]"), function (el) {
      var k = +el.getAttribute("data-s");
      el.classList.toggle("is-on", step >= k);
      el.classList.toggle("is-cur", step === k);
    });
    var p = seq[pos];
    whereEl.textContent = p.kind === "home" ? "Overzicht" : p.blok.naam + "  " + p.nr + "/" + p.van;
    dotsEl.innerHTML = steps ? new Array(steps + 1).join("<i></i>") : "";
    Array.prototype.forEach.call(dotsEl.children, function (d, i) { d.className = i < step ? "on" : ""; });
  }

  /* ---------- Navigatie ---------- */
  function next() {
    if (step < steps) { step++; applyStep(); return; }
    if (pos < seq.length - 1) { pos++; render(false); }
  }
  function prev() {
    if (step > 0) { step--; applyStep(); return; }
    if (pos > 0) { pos--; render(true); }
  }
  function home() {
    var p = seq[pos];
    if (p.kind === "home") return;
    var i = blokken.indexOf(p.blok);
    for (var k = 0; k < seq.length; k++) if (seq[k].kind === "home" && seq[k].hl === i) { pos = k; render(false); return; }
  }
  function openBlok(id) {
    for (var k = 0; k < seq.length; k++) if (seq[k].kind === "tile" && seq[k].blok.id === id) { pos = k; render(false); return; }
  }
  function goHash(first) {
    var id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    for (var k = 0; k < seq.length; k++) if (seq[k].kind === "tile" && seq[k].tile.id === id) { pos = k; render(false); return; }
    if (first || seq[pos].kind !== "home") { pos = 0; render(false); }
  }
  function hashOf(p) { return p.kind === "home" ? "#/" : "#/" + p.tile.id; }
  // alleen reageren als iemand zelf het adres wijzigt (niet op ons eigen bijwerken)
  window.addEventListener("hashchange", function () { if (location.hash !== hashOf(seq[pos])) goHash(); });

  /* ---------- Volledig scherm ---------- */
  var fullBtn = document.querySelector('[data-act="full"]');
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function toggleFull() {
    try {
      if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else {
        var r = (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
        if (r && r.catch) r.catch(function () {});
      }
    } catch (e) { /* volledig scherm niet toegestaan: gewoon doorgaan */ }
  }
  function syncFull() { fullBtn.innerHTML = isFull() ? BTN.exit : BTN.full; fullBtn.setAttribute("aria-label", isFull() ? "Volledig scherm sluiten (F)" : "Volledig scherm (F)"); }
  document.addEventListener("fullscreenchange", syncFull);
  document.addEventListener("webkitfullscreenchange", syncFull);

  /* ---------- Bediening ---------- */
  var ACT = { home: home, prev: prev, next: next, full: toggleFull };
  Array.prototype.forEach.call(document.querySelectorAll(".bar-btn"), function (b) {
    var a = b.getAttribute("data-act");
    if (BTN[a]) b.innerHTML = BTN[a];
    b.addEventListener("click", function (e) { e.stopPropagation(); ACT[a](); b.blur(); });
  });
  document.addEventListener("click", function (e) {
    if (e.button !== 0) return;
    var blk = e.target.closest && e.target.closest(".blk");
    if (blk) { e.preventDefault(); if (!blk.hasAttribute("aria-disabled")) openBlok(+blk.getAttribute("data-blok")); return; }
    if (e.target.closest && e.target.closest("button, a, input, select, textarea")) return;
    next();
  });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); next(); });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key, onCtl = e.target.closest && e.target.closest("button, a");
    if ((k === " " || k === "Enter") && onCtl) return; // knop of link met het toetsenbord bedienen
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Spacebar" || k === "Enter") { e.preventDefault(); next(); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); prev(); }
    else if (k === "Escape" || k === "Esc" || k === "Home") { e.preventDefault(); home(); }
    else if (k === "f" || k === "F") { e.preventDefault(); toggleFull(); }
    else if (/^[1-9]$/.test(k) && seq[pos].kind === "home") { e.preventDefault(); openBlok(+k); }
  });

  /* ---------- Schalen ---------- */
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    deck.style.transform = "translate(" + Math.round((vw - W * s) / 2) + "px," + Math.round((vh - H * s) / 2) + "px) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();
  syncFull();
  goHash(true);
})();

</script>
</body>
</html>
